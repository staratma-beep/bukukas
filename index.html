<script>
(function() {

    setItem: function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} },

  function startApp() {
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      var count = 0;
      var timer = setInterval(function() {
        count++;
        if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
          clearInterval(timer);
          renderApp();
        } else if (count >= 120) { // 6 detik batas waktu tunggu CDN
          clearInterval(timer);
          showCdnError();

      }, 50);

      renderApp();
    }
  }

  function renderApp() {
const {useState,useEffect,useMemo,useRef}=React;
const h=React.createElement;

// Konfigurasi Firebase Realtime Database
const firebaseConfig = {
  apiKey: "AIzaSyBAuXES0EX8DTQqb34BTof7UEpicZh9z-E",
  authDomain: "bukudebitkredit-d7241.firebaseapp.com",
  databaseURL: "https://bukudebitkredit-d7241-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bukudebitkredit-d7241",
  storageBucket: "bukudebitkredit-d7241.firebasestorage.app",
  messagingSenderId: "104361028199",
  appId: "1:104361028199:web:dacc1614cf67c5756b42c2"
};

let fbDb = null;
let txsRef = null;
let usersRef = null;
let configRef = null;
let kegiatanListRef = null;
let kegiatanDataRef = null;

try {
  if (window.firebase && firebase.initializeApp) {
    const fbApp = firebase.initializeApp(firebaseConfig);
    fbDb = firebase.database();
    txsRef = fbDb.ref('buku_kas/transactions');

} catch (e) {
  console.warn('Firebase init error:', e);
}

// Bersihkan cache localStorage lama agar data 100% tersinkronisasi via Firebase Realtime Database
try {
  safeStorage.removeItem('debet-kredit-users-v2');
  safeStorage.removeItem('debet-kredit-users-v1');
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k && k.startsWith('debet-kredit-user-')) {
      safeStorage.removeItem(k);
    }
  }
} catch(e) {}

const KEY_PREFIX='debet-kredit-user-v2-';
const SESSION_KEY='debet-kredit-session-v1';
const USERS_KEY='debet-kredit-users-v2';

const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(n).toLocaleString('id-ID');
const tgl=s=>{if(!s)return '';const p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const empty=()=>({tanggal:today(),ket:'',jenis:'D',jumlah:''});

const defaultUsers=[
  {username:'admin',password:'admin',role:'admin'}
];

const dummyData=[];

const ico=(paths)=>h('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.5,strokeLinecap:'round',strokeLinejoin:'round','aria-hidden':'true'},paths.map((d,i)=>h('path',{key:i,d:d})));
const IcoEdit=()=>ico(['M12 20h9','M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z']);
const IcoTrash=()=>ico(['M3 6h18','M8 6V4h8v2','M19 6l-1 14H6L5 6','M10 11v6','M14 11v6']);
const IcoUser=()=>ico(['M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2','M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z']);
const IcoLogout=()=>ico(['M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4','M16 17l5-5-5-5','M21 12H9']);
const kunci=t=>t.tanggal+'|'+t.ket+'|'+t.jenis+'|'+t.jumlah;

const parseCsv=(text)=>{
  text=text.replace(/^\uFEFF/,'');
  const first=text.split('\n')[0]||'';
  const d=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===d){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}
    else cur+=c;
  }
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
};

const normTgl=(s)=>{
  s=(s||'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/),y,mo,da;
  if(m){y=m[1];mo=m[2];da=m[3];}
  else{m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(!m)return null;da=m[1];mo=m[2];y=m[3];}
  mo=mo.padStart(2,'0');da=da.padStart(2,'0');
  if(+mo<1||+mo>12||+da<1||+da>31)return null;
  return y+'-'+mo+'-'+da;
};

const angka=(s)=>parseInt(String(s||'').trim().replace(/[.,]00$/,'').replace(/[^\d]/g,'')||'0',10);

const bacaTx=(text)=>{
  const rows=parseCsv(text);
  if(rows.length<2)return {error:'File kosong atau hanya berisi baris judul header.'};
  const head=rows[0].map(x=>x.trim().toLowerCase());
  const iT=head.indexOf('tanggal'),iK=head.indexOf('keterangan'),iD=head.indexOf('debet'),iKr=head.indexOf('kredit');
  if(iT<0||iK<0||iD<0||iKr<0)return {error:'Baris pertama harus berisi header: Tanggal, Keterangan, Debet, Kredit.'};
  const txs=[];let skip=0;
  rows.slice(1).forEach((r,i)=>{
    const tanggal=normTgl(r[iT]),ket=(r[iK]||'').trim(),dbt=angka(r[iD]),krd=angka(r[iKr]);
    if(!tanggal||!ket||(dbt>0)===(krd>0)){skip++;return;}
    txs.push({id:Date.now()+i,tanggal:tanggal,ket:ket,jenis:dbt>0?'D':'K',jumlah:dbt>0?dbt:krd});
  });
  return {txs:txs,skip:skip};
};

function Pilih(p){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    const close=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    const esc=e=>{if(e.key==='Escape')setOpen(false);};
    document.addEventListener('mousedown',close);document.addEventListener('keydown',esc);
    return ()=>{document.removeEventListener('mousedown',close);document.removeEventListener('keydown',esc);};
  },[]);
  const cur=p.opsi.find(o=>o.v===p.value)||p.opsi[0];
  return h('div',{ref:ref,className:'relative'},
    h('button',{
      type:'button',
      onClick:()=>setOpen(!open),
      className:'nb-in flex items-center justify-between text-xs font-bold cursor-pointer transition-all '+(cur.c||'bg-white'),
      style:{boxShadow:open?'4px 4px 0 0 #111':'none'},
      'aria-haspopup':'listbox',
      'aria-expanded':open
    },
      h('span',{className:'truncate font-bold'},cur.l),
      h('svg',{
        width:15,height:15,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:3,strokeLinecap:'round',strokeLinejoin:'round',
        style:{transform:open?'rotate(180deg)':'none',transition:'transform .15s',flexShrink:0,marginLeft:'6px'},
        'aria-hidden':'true'
      },h('path',{d:'M6 9l6 6 6-6'}))
    ),
    open?h('div',{className:'pilih-list z-50 animate-fadeIn',role:'listbox'},p.opsi.map(o=>h('button',{
      key:o.v,
      type:'button',
      role:'option',
      'aria-selected':o.v===p.value,
      className:'pilih-opt text-xs py-2 px-3 font-bold border-b-2 border-black last:border-b-0 '+(o.v===p.value?'bg-canary font-black '+(o.c||''):'hover:bg-slate-50'),
      onClick:()=>{p.onChange(o.v);setOpen(false);}
    },o.l))):null
  );
}

function Modal(p){
  return h('div',{
    className:'nb-card p-3 sm:p-4 border-2 border-black bg-white shadow-[4px_4px_0_0_#111] no-print space-y-2.5 my-2.5 animate-fadeIn'
  },
    // Header Panel Bersih & 1 Baris dengan Tombol Silang (✕) Senada
    h('div',{className:'flex justify-between items-center pb-2 border-b-2 border-black'},
      h('h3',{className:'text-sm sm:text-base font-extrabold tracking-tight truncate'},p.title),
      p.onClose ? h('button',{
        type:'button',
        onClick:(e)=>{ if(e) e.stopPropagation(); p.onClose(); },
        className:'w-7 h-7 sm:w-8 sm:h-8 rounded-lg border-2 border-black bg-white hover:bg-coral hover:text-white flex items-center justify-center font-black text-xs sm:text-sm shadow-[2px_2px_0_0_#111] cursor-pointer flex-shrink-0 transition-all',
        title:'Tutup'
      },'✕') : null
    ),
    // Isi Konten Panel
    h('div',{className:'space-y-3 pt-0.5'},
      p.children
    ),
    // Footer Tombol Aksi (jika ada)
    (p.actions && p.actions.filter(Boolean).length > 0) ? h('div',{className:'pt-2 border-t-2 border-black/10 flex flex-wrap justify-end gap-2'},
      p.actions
    ) : null
  );
}

// Halaman Login & Registrasi User
// Halaman Login Bersih (Hanya Masuk, Tanpa Registrasi Publik & Tanpa Tombol Demo)
function LoginPage({onLoginSuccess, notify, appSettings, sessionExpiredMsg}){
  const [username, setUsername]=useState('');
  const [password, setPassword]=useState('');
  const [showPassword, setShowPassword]=useState(false);
  const [err, setErr]=useState('');

  const [usersList, setUsersList]=useState(defaultUsers);
  const [isFbReady, setIsFbReady]=useState(false);

  useEffect(()=>{
    if(fbDb){
      fbDb.ref('.info/connected').on('value', snap => {
        setIsFbReady(Boolean(snap.val()));
      });
    }
    if(usersRef){
      usersRef.on('value', snapshot => {
        const val = snapshot.val();
        if(val && Array.isArray(val) && val.length > 0){
          setUsersList(val);
          setIsFbReady(true);
        } else if(!val) {
          usersRef.set(defaultUsers);
          setIsFbReady(true);
        }
      }, err => {
        console.warn('Firebase users sync error:', err);
        setIsFbReady(false);
      });
    }
  },[]);

  const getUsers=()=> usersList;

  const handleLogin=(e)=>{
    if(e) e.preventDefault();
    setErr('');
    const u = username.trim().toLowerCase();
    const p = password.trim();
    if(!u || !p){
      setErr('Username dan password wajib diisi.');
      return;
    }
    const users = getUsers();
    const found = users.find(x => x.username.toLowerCase() === u && x.password === p);
    if(found){
      onLoginSuccess(found);
    } else {
      setErr('Username atau password salah.');
    }
  };

  return h('div',{className:'min-h-screen flex items-center justify-center p-4'},
    h('div',{className:'nb-card max-w-sm w-full p-6 sm:p-8',style:{background:'#fff'}},
      
      // Header Brand (Dinamis sesuai Pengaturan Web Settings)
      h('div',{className:'text-center mb-6'},
        h('div',{className:'inline-block mb-2'},
          h('span',{
            className:`tag ${(appSettings && appSettings.themeColor) ? appSettings.themeColor : 'pink'} text-xl sm:text-2xl font-extrabold tracking-tight`,
            style:{borderRadius:'10px',padding:'.3rem .9rem',boxShadow:'4px 4px 0 0 #111'}
          }, (appSettings && appSettings.appName) ? appSettings.appName : 'Buku Debet Kredit')
        ),
        h('h2',{className:'text-xl tracking-tight mt-2'},'Masuk Akun')
      ),

      // Banner Notifikasi Sesi Kedaluwarsa karena tidak digunakan
      sessionExpiredMsg ? h('div',{
        className:'mb-3 p-2.5 rounded-lg border-2 border-black flex items-center gap-2 text-xs font-bold shadow-[2px_2px_0_0_#111]',
        style:{ backgroundColor: '#ffd23f', color: '#111111' }
      },
        h('span',{style:{fontSize:'16px',flexShrink:0}},'⏱️'),
        h('span',{className:'flex-1 font-bold'}, sessionExpiredMsg)
      ) : null,

      // Error Alert Box (Teks tebal jelas dengan warna latar Coral)
      err ? h('div',{
        className:'mb-4 p-2.5 rounded-lg border-2 border-black flex items-center gap-2 text-xs font-bold shadow-[2px_2px_0_0_#111]',
        style:{ backgroundColor: '#ff6b5e', color: '#111111' }
      },
        h('span',{style:{fontSize:'15px',flexShrink:0}},'⚠️'),
        h('span',{className:'flex-1 font-extrabold'},err)
      ) : null,

      // FORM MASUK
      h('form',{onSubmit:handleLogin, className:'space-y-4'},
        h('div',null,
          h('label',{htmlFor:'login-user',className:'block text-xs font-bold uppercase mb-1'},'Username'),
          h('input',{
            id:'login-user',
            type:'text',
            value:username,
            onChange:e=>setUsername(e.target.value),
            className:'nb-in',
            autoComplete:'username'
          })
        ),
        h('div',null,
          h('label',{htmlFor:'login-pass',className:'block text-xs font-bold uppercase mb-1'},'Password'),
          h('div',{className:'relative flex items-center'},
            h('input',{
              id:'login-pass',
              type: showPassword ? 'text' : 'password',
              value:password,
              onChange:e=>setPassword(e.target.value),
              className:'nb-in in-pass',
              autoComplete:'current-password'
            }),
            h('button',{
              type:'button',
              onClick:()=>setShowPassword(!showPassword),
              className:'absolute right-2 p-1.5 text-slate-700 hover:text-black cursor-pointer bg-transparent border-0 flex items-center justify-center',
              title: showPassword ? 'Sembunyikan password' : 'Lihat password',
              'aria-label': showPassword ? 'Sembunyikan password' : 'Lihat password'
            },
              showPassword ?
                h('svg',{width:19,height:19,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},
                  h('path',{d:'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24'}),
                  h('line',{x1:1,y1:1,x2:23,y2:23})
                ) :
                h('svg',{width:19,height:19,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},
                  h('path',{d:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'}),
                  h('circle',{cx:12,cy:12,r:3})
                )
            )
          )
        ),
        h('button',{
          type:'submit',
          className:'nb-btn mint w-full py-2.5 font-bold text-sm shadow-[4px_4px_0_0_#111] mt-2'
        },'Masuk ke Buku Kas')
      )
    )
  );
}

// Modal Kelola Pengguna (Hanya untuk Admin)
// Komponen Panel Kelola Pengguna Terintegrasi (Bisa Buka-Tutup, Tanpa Pop-up, Tanpa Nama Lengkap)
// Komponen Panel Kelola Pengguna & Ganti Password (Menyatu dalam halaman, bisa buka-tutup)
function UserManagementPanel({currentUser, onClose, notify, onUpdateCurrentUser}){
  const [users, setUsers]=useState(defaultUsers);

  useEffect(()=>{
    if(usersRef){
      usersRef.on('value', snapshot => {
        const val = snapshot.val();
        if(val && Array.isArray(val) && val.length > 0){
          setUsers(val);
        }
      }, err => {
        console.warn('Firebase users sync error:', err);
      });
    }
  },[]);
  
  // State untuk Tambah Pengguna Baru
  const [newUser, setNewUser]=useState('');
  const [newPass, setNewPass]=useState('');
  const [showNewPass, setShowNewPass]=useState(false);
  const [newRole, setNewRole]=useState('staf');
  
  // State untuk Ganti Password Akun Aktif
  const [currOldPass, setCurrOldPass]=useState('');
  const [currNewPass, setCurrNewPass]=useState('');
  const [currNewPassConfirm, setCurrNewPassConfirm]=useState('');
  
  // State untuk Admin Reset Password Akun Tertentu
  const [editingUserPass, setEditingUserPass]=useState(null);
  const [adminSetPass, setAdminSetPass]=useState('');
  const [showAdminSetPass, setShowAdminSetPass]=useState(false);

  const [err, setErr]=useState('');
  const [succ, setSucc]=useState('');

  const saveList=(list)=>{
    setUsers(list);
    if(usersRef){
      usersRef.set(list).catch(err => {
        console.warn('Firebase write error:', err);
        notify('Gagal menyimpan user ke Firebase: periksa aturan Rules!', 'err');
      });
    }
  };

  // 1. Fungsi Ganti Password Akun Sendiri
  const handleChangeMyPassword=(e)=>{
    if(e) e.preventDefault();
    setErr('');
    setSucc('');
    const oldP = currOldPass.trim();
    const newP = currNewPass.trim();
    const newPC = currNewPassConfirm.trim();

    if(!oldP || !newP || !newPC){
      setErr('Semua kolom ganti password wajib diisi.');
      return;
    }
    // Cari user aktif di list
    const found = users.find(x => x.username.toLowerCase() === currentUser.username.toLowerCase());
    if(!found || found.password !== oldP){
      setErr('Password lama Anda salah.');
      return;
    }
    if(newP.length < 4){
      setErr('Password baru minimal 4 karakter.');
      return;
    }
    if(newP !== newPC){
      setErr('Konfirmasi password baru tidak cocok.');
      return;
    }

    const updated = users.map(u => {
      if(u.username.toLowerCase() === currentUser.username.toLowerCase()){
        return Object.assign({}, u, { password: newP });
      }
      return u;
    });

    saveList(updated);
    // Update sesi login
    const updatedUser = Object.assign({}, currentUser, { password: newP });
    onUpdateCurrentUser(updatedUser);

    setCurrOldPass('');
    setCurrNewPass('');
    setCurrNewPassConfirm('');
    setSucc('Password akun @' + currentUser.username + ' berhasil diubah!');
    notify('Password Anda berhasil diganti!');
  };

  // 2. Fungsi Admin Mengubah Password Pengguna Lain
  const handleSaveAdminSetPass=(targetUsername)=>{
    setErr('');
    setSucc('');
    const p = adminSetPass.trim();
    if(p.length < 4){
      setErr('Password minimal 4 karakter.');
      return;
    }
    const updated = users.map(u => {
      if(u.username.toLowerCase() === targetUsername.toLowerCase()){
        return Object.assign({}, u, { password: p });
      }
      return u;
    });
    saveList(updated);
    if(targetUsername.toLowerCase() === currentUser.username.toLowerCase() && onUpdateCurrentUser){
      onUpdateCurrentUser(Object.assign({}, currentUser, { password: p }));
    }
    setEditingUserPass(null);
    setAdminSetPass('');
    setSucc('Password untuk @' + targetUsername + ' berhasil diubah!');
    notify('Password @' + targetUsername + ' diperbarui.');
  };

  // 3. Fungsi Tambah Pengguna Baru
  const handleAddUser=(e)=>{
    if(e) e.preventDefault();
    setErr('');
    setSucc('');
    const u = newUser.trim().toLowerCase();
    const p = newPass.trim();

    if(!u || !p){
      setErr('Username dan password pengguna baru wajib diisi.');
      return;
    }
    if(u.length < 3){
      setErr('Username minimal 3 karakter.');
      return;
    }
    if(p.length < 4){
      setErr('Password minimal 4 karakter.');
      return;
    }
    if(users.some(x => x.username.toLowerCase() === u)){
      setErr('Username "' + u + '" sudah digunakan.');
      return;
    }

    const updated = users.concat([{
      username: u,
      password: p,
      role: newRole
    }]);

    saveList(updated);
    setNewUser('');
    setNewPass('');
    setNewRole('staf');
    setSucc('Pengguna @' + u + ' (' + newRole + ') berhasil ditambahkan!');
    notify('Akun "@' + u + '" berhasil dibuat!');
  };

  const handleDeleteUser=(targetUsername)=>{
    setErr('');
    setSucc('');
    if(targetUsername.toLowerCase() === currentUser.username.toLowerCase()){
      setErr('Anda tidak bisa menghapus akun Anda sendiri.');
      return;
    }
    const updated = users.filter(x => x.username.toLowerCase() !== targetUsername.toLowerCase());
    saveList(updated);
    notify('Akun "@' + targetUsername + '" telah dihapus.');
  };

  const isAdmin = (currentUser.role || currentUser.username) === 'admin';

  return h('div',{className:'nb-card p-3 sm:p-4 border-2 border-black bg-white shadow-[4px_4px_0_0_#111] no-print space-y-2.5'},
    // Header Panel Bersih, Simpel & 1 Baris dengan Tombol Silang (✕)
    h('div',{className:'flex justify-between items-center pb-2 border-b-2 border-black'},
      h('div',{className:'flex items-center gap-2 min-w-0'},
        h('h3',{className:'text-sm sm:text-base font-extrabold tracking-tight truncate'},'👥 Kelola Pengguna'),
        h('span',{className:`tag ${isAdmin ? 'mint' : 'lilac'} text-[9px] py-0 px-1.5 font-bold flex-shrink-0`},isAdmin ? 'Admin' : 'Staf')
      ),
      h('button',{
        type:'button',
        onClick:onClose,
        className:'w-7 h-7 sm:w-8 sm:h-8 rounded-lg border-2 border-black bg-white hover:bg-coral hover:text-white flex items-center justify-center font-black text-xs sm:text-sm shadow-[2px_2px_0_0_#111] cursor-pointer flex-shrink-0 transition-all',
        title:'Tutup Panel'
      },'✕')
    ),

    err ? h('div',{className:'p-2.5 rounded-lg border-2 border-black text-xs font-bold shadow-[2px_2px_0_0_#111]', style:{backgroundColor:'#ff6b5e',color:'#111111'}},
      '⚠️ ' + err
    ) : null,

    succ ? h('div',{className:'p-2.5 rounded-lg border-2 border-black bg-mint text-black text-xs font-bold shadow-[2px_2px_0_0_#111]'},
      '✅ ' + succ
    ) : null,

    // KARTU 2 & 3: KHUSUS ADMIN (FORM RINGKAS & DAFTAR AKUN RAPI)
    isAdmin ? h('div',{className:'space-y-3'},
      // Form Tambah Pengguna Baru (Ringkas, Rapat, 2 Baris di Mobile)
      h('form',{onSubmit:handleAddUser, className:'p-3 rounded-xl border-2 border-black bg-cream shadow-[2px_2px_0_0_#111] space-y-2'},
        h('div',{className:'flex items-center justify-between pb-1 border-b border-black/10'},
          h('span',{className:'text-[11px] font-black uppercase tracking-wider text-slate-800'},'+ Tambah Akun Pengguna'),
          h('span',{className:'text-[10px] text-slate-500 font-bold'},'Staf / Kasir')
        ),
        // Grid 2 Kolom Ringkas di Mobile, 3 Kolom di Layar Lebar
        h('div',{className:'grid grid-cols-2 sm:grid-cols-3 gap-2'},
          // 1. Username
          h('div',null,
            h('label',{className:'block text-[10px] font-bold uppercase mb-0.5 text-slate-700'},'Username Baru'),
            h('input',{
              type:'text',
              value:newUser,
              placeholder:'Username',
              onChange:e=>setNewUser(e.target.value),
              className:'nb-in text-xs py-1 px-2.5 h-9 min-h-0'
            })
          ),
          // 2. Password Awal
          h('div',null,
            h('label',{className:'block text-[10px] font-bold uppercase mb-0.5 text-slate-700'},'Password Awal'),
            h('div',{className:'relative flex items-center'},
              h('input',{
                type: showNewPass ? 'text' : 'password',
                value:newPass,
                placeholder:'Min. 4 huruf',
                onChange:e=>setNewPass(e.target.value),
                className:'nb-in in-pass text-xs py-1 px-2.5 h-9 min-h-0'
              }),
              h('button',{
                type:'button',
                onClick:()=>setShowNewPass(!showNewPass),
                className:'absolute right-1.5 p-1 text-slate-600 hover:text-black cursor-pointer bg-transparent border-0 flex items-center justify-center',
                title: showNewPass ? 'Sembunyikan password' : 'Lihat password'
              },
                showNewPass ?
                  h('svg',{width:15,height:15,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},
                    h('path',{d:'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24'}),
                    h('line',{x1:1,y1:1,x2:23,y2:23})
                  ) :
                  h('svg',{width:15,height:15,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},
                    h('path',{d:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'}),
                    h('circle',{cx:12,cy:12,r:3})
                  )
              )
            )
          ),
          // 3. Peran (Role)
          h('div',{className:'col-span-2 sm:col-span-1'},
            h('label',{className:'block text-[10px] font-bold uppercase mb-0.5 text-slate-700'},'Peran (Role)'),
            h('select',{
              value:newRole,
              onChange:e=>setNewRole(e.target.value),
              className:'nb-in text-xs py-1 px-2.5 h-9 min-h-0 font-bold bg-white'
            },
              h('option',{value:'staf'},'Staf (Hanya Catat)'),
              h('option',{value:'admin'},'Administrator (Penuh)')
            )
          )
        ),
        // Tombol Simpan
        h('div',{className:'pt-1'},
          h('button',{
            type:'submit',
            className:'nb-btn mint w-full sm:w-auto text-xs py-1.5 px-4 font-bold shadow-[2px_2px_0_0_#111] h-9 min-h-0 flex items-center justify-center gap-1.5'
          }, '+ Simpan Akun Baru')
        )
      ),

      // Daftar Pengguna Aktif (Bersih, Ramping & Rapi)
      h('div',{className:'pt-1'},
        h('div',{className:'flex items-center justify-between mb-1.5'},
          h('h4',{className:'text-[11px] font-extrabold uppercase tracking-wider text-slate-800'},'Daftar Semua Pengguna Terdaftar'),
          h('span',{className:'tag canary text-[9px] py-0 px-2 font-bold'},users.length + ' Pengguna')
        ),
        h('div',{className:'grid grid-cols-1 sm:grid-cols-2 gap-2'},
          users.map(u => {
            const isMe = u.username.toLowerCase() === currentUser.username.toLowerCase();
            const uIsAdmin = (u.role || (u.username==='admin'?'admin':'staf')) === 'admin';
            const isEditingThis = editingUserPass === u.username;

            return h('div',{
              key:u.username,
              className:'p-2.5 rounded-lg border-2 border-black bg-white shadow-[2px_2px_0_0_#111] space-y-1.5'
            },
              h('div',{className:'flex items-center justify-between'},
                h('div',{className:'flex items-center gap-1.5 min-w-0'},
                  h('span',{className:'mono font-extrabold text-xs truncate'},'@' + u.username),
                  isMe ? h('span',{className:'tag canary text-[9px] py-0 px-1.5 font-bold'},'Anda') : null,
                  h('span',{className:`tag ${uIsAdmin ? 'mint' : 'lilac'} text-[9px] py-0 px-1.5 font-bold`},uIsAdmin ? 'Admin' : 'Staf')
                ),
                h('div',{className:'flex items-center gap-1.5 flex-shrink-0'},
                  h('button',{
                    type:'button',
                    onClick:()=>{
                      if(isEditingThis){
                        setEditingUserPass(null);
                        setAdminSetPass('');
                      } else {
                        setEditingUserPass(u.username);
                        setAdminSetPass('');
                      }
                    },
                    className:'ico-btn canary text-xs w-7 h-7 min-h-0',
                    title:'Ganti / Reset Password Akun Ini'
                  },'🔑'),
                  !isMe ? h('button',{
                    type:'button',
                    onClick:()=>handleDeleteUser(u.username),
                    className:'ico-btn coral text-xs w-7 h-7 min-h-0',
                    title:'Hapus Pengguna'
                  },'🗑️') : null
                )
              ),
              // Kotak Ubah Password oleh Admin jika tombol kunci ditekan
              isEditingThis ? h('div',{className:'pt-1.5 border-t border-slate-200'},
                h('label',{className:'block text-[10px] font-bold text-slate-600 mb-1'},'Set Password Baru untuk @' + u.username + ':'),
                h('div',{className:'flex gap-1.5 items-center'},
                  h('div',{className:'relative flex-1 flex items-center'},
                    h('input',{
                      type: showAdminSetPass ? 'text' : 'password',
                      placeholder:'Password baru...',
                      value:adminSetPass,
                      onChange:e=>setAdminSetPass(e.target.value),
                      className:'nb-in in-pass text-xs py-1 px-2 h-8 min-h-0'
                    }),
                    h('button',{
                      type:'button',
                      onClick:()=>setShowAdminSetPass(!showAdminSetPass),
                      className:'absolute right-1 p-1 text-slate-700 hover:text-black cursor-pointer bg-transparent border-0 flex items-center justify-center',
                      title: showAdminSetPass ? 'Sembunyikan' : 'Lihat'
                    },
                      showAdminSetPass ?
                        h('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},
                          h('path',{d:'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24'}),
                          h('line',{x1:1,y1:1,x2:23,y2:23})
                        ) :
                        h('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},
                          h('path',{d:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'}),
                          h('circle',{cx:12,cy:12,r:3})
                        )
                    )
                  ),
                  h('button',{
                    type:'button',
                    onClick:()=>handleSaveAdminSetPass(u.username),
                    className:'nb-btn mint text-[10px] px-2.5 py-1 font-bold h-8 min-h-0'
                  },'Simpan'),
                  h('button',{
                    type:'button',
                    onClick:()=>setEditingUserPass(null),
                    className:'nb-btn text-[10px] px-2 py-1 h-8 min-h-0'
                  },'✕')
                )
              ) : null
            );
          })
        )
      )
    ) : null
  );
}


// Modal Pengaturan & Panduan Format Google Spreadsheet
function SpreadsheetConfigModal({ config, onClose, onSave, onSyncAll, isMandatory, notify }){
  const [sheetUrl, setSheetUrl] = useState((config && config.sheetUrl) || '');
  const [scriptUrl, setScriptUrl] = useState((config && config.scriptUrl) || '');
  const [guideOpen, setGuideOpen] = useState(false);
  const [copied, setCopied] = useState(false);
  const [err, setErr] = useState('');

  const gasCode = `function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sheet = ss.getSheetByName("Buku Kas") || ss.getActiveSheet();
    
    // Pastikan baris header ada di baris 1 (7 kolom tanpa kolom waktu)
    if (sheet.getLastRow() === 0) {
      sheet.appendRow(["No", "Tanggal", "Keterangan", "Jenis", "Debet (Rp)", "Kredit (Rp)", "Saldo (Rp)"]);
      sheet.getRange(1, 1, 1, 7).setFontWeight("bold").setBackground("#ffd23f");
    }
    
    if (data.action === "sync_all" && Array.isArray(data.items)) {
      if (sheet.getLastRow() > 1) {
        sheet.deleteRows(2, sheet.getLastRow() - 1);
      }
      var rows = [];
      data.items.forEach(function(item, idx) {
        rows.push([
          idx + 1,
          item.tanggal,
          item.ket,
          item.jenis === 'D' ? 'Debet' : 'Kredit',
          item.jenis === 'D' ? item.jumlah : 0,
          item.jenis === 'K' ? item.jumlah : 0,
          item.saldo || 0
        ]);
      });
      if (rows.length > 0) {
        sheet.getRange(2, 1, rows.length, 7).setValues(rows);
      }
    }
    return ContentService.createTextOutput(JSON.stringify({status:"success"})).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({status:"error",message:err.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
}`;

  const copyCode = () => {

// Komponen SingleDatePicker (Kalender interaktif untuk input 1 tanggal, tema Neobrutalism)
function SingleDatePicker({ value, onChange }){
  const [open, setOpen] = useState(false);
  const [viewYear, setViewYear] = useState(() => {
    const d = value ? new Date(value + 'T00:00:00') : new Date();
    return d.getFullYear();
  });
  const [viewMonth, setViewMonth] = useState(() => {
    const d = value ? new Date(value + 'T00:00:00') : new Date();
    return d.getMonth();
  });
  const ref = useRef(null);

  useEffect(() => {
    const handleOutside = (e) => {
      if (ref.current && !ref.current.contains(e.target)) {
        setOpen(false);
      }
    };
    document.addEventListener('mousedown', handleOutside);
    document.addEventListener('touchstart', handleOutside);
    return () => {
      document.removeEventListener('mousedown', handleOutside);
      document.removeEventListener('touchstart', handleOutside);
    };
  }, []);

  const monthNames = [
    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
  ];

  const prevMonth = (e) => {
    if(e) e.stopPropagation();
    if (viewMonth === 0) {
      setViewMonth(11);
      setViewYear(viewYear - 1);
    } else {
      setViewMonth(viewMonth - 1);
    }
  };

  const nextMonth = (e) => {
    if(e) e.stopPropagation();
    if (viewMonth === 11) {
      setViewMonth(0);
      setViewYear(viewYear + 1);
    } else {
      setViewMonth(viewMonth + 1);
    }
  };

  const toYMD = (year, month, day) => {
    return year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
  };

  const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0 = Minggu
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const handleSelect = (ymd) => {
    onChange(ymd);
    setOpen(false);
  };

  const setToday = (e) => {
    if(e) e.stopPropagation();
    const now = new Date();
    const todayStr = toYMD(now.getFullYear(), now.getMonth(), now.getDate());
    onChange(todayStr);
    setViewYear(now.getFullYear());
    setViewMonth(now.getMonth());
    setOpen(false);
  };

  const cells = [];
  for (let i = 0; i < firstDay; i++) {
    cells.push(h('div', { key: 'empty-' + i, className: 'h-8' }));
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const ymd = toYMD(viewYear, viewMonth, day);
    const isSelected = value === ymd;

    let cellClass = 'h-8 w-8 text-xs font-bold rounded-lg flex items-center justify-center cursor-pointer transition-colors ';
    if (isSelected) {
      cellClass += 'bg-black text-white shadow-[1px_1px_0_0_#ffd23f] font-black z-10';
    } else {
      cellClass += 'hover:bg-canary text-slate-800';
    }

    cells.push(h('div', {
      key: ymd,
      onClick: () => handleSelect(ymd),
      className: cellClass
    }, day));
  }

  return h('div', { ref: ref, className: 'relative' },
    // Kotak Input Pilihan Tanggal
    h('div', {
      onClick: () => setOpen(!open),
      className: 'nb-in flex items-center justify-between cursor-pointer select-none bg-white',
      style: { boxShadow: open ? '3px 3px 0 0 #ff3d81' : 'none' }
    },
      h('div', { className: 'flex items-center gap-2 truncate' },
        h('span', { className: 'text-sm' }, '📅'),
        h('span', { className: 'text-xs font-bold text-slate-900 truncate' }, value ? tgl(value) : 'Pilih Tanggal')
      ),
      h('span', {
        className: 'text-[9px] text-slate-500 transition-transform duration-150',
        style: { transform: open ? 'rotate(180deg)' : 'none' }
      }, '▼')
    ),

    // Popover Kalender Neobrutalism
    open ? h('div', {
      className: 'absolute left-0 top-full mt-2 z-50 bg-white border-2 border-black rounded-xl p-3 shadow-[6px_6px_0_0_#111] w-[285px] sm:w-[315px] space-y-2.5 animate-fadeIn'
    },
      // Header Kalender
      h('div', { className: 'flex items-center justify-between pb-1 border-b border-slate-200' },
        h('button', {
          type: 'button',
          onClick: prevMonth,
          className: 'ico-btn text-xs w-7 h-7 flex items-center justify-center shadow-[1px_1px_0_0_#111]'
        }, '◀'),
        h('span', { className: 'font-extrabold text-xs text-slate-900' }, monthNames[viewMonth] + ' ' + viewYear),
        h('button', {
          type: 'button',
          onClick: nextMonth,
          className: 'ico-btn text-xs w-7 h-7 flex items-center justify-center shadow-[1px_1px_0_0_#111]'
        }, '▶')
      ),

      // Header Nama Hari
      h('div', { className: 'grid grid-cols-7 text-center text-[10px] font-black text-slate-500 uppercase' },
        ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].map((d, i) => h('div', { key: d, className: i === 0 ? 'text-coral' : '' }, d))
      ),

      // Grid Sel Tanggal
      h('div', { className: 'grid grid-cols-7 gap-1 text-center select-none' }, cells),

      // Tombol Hari Ini
      h('div', { className: 'pt-1.5 border-t border-slate-200 flex justify-center' },
        h('button', {
          type: 'button',
          onClick: setToday,
          className: 'tag canary text-[10px] py-1 px-3 font-bold cursor-pointer'
        }, 'Hari Ini')
      )
    ) : null
  );
}

// Komponen DateRangePicker (Satu inputan interaktif, drag & klik rentang tanggal, kalender popover Neobrutalism)
function DateRangePicker({ dari, sampai, onChange }){
  const [open, setOpen] = useState(false);
  const [viewYear, setViewYear] = useState(() => {
    const d = dari ? new Date(dari + 'T00:00:00') : new Date();
    return d.getFullYear();
  });
  const [viewMonth, setViewMonth] = useState(() => {
    const d = dari ? new Date(dari + 'T00:00:00') : new Date();
    return d.getMonth();
  });
  const [dragStart, setDragStart] = useState(null);
  const [hoverDate, setHoverDate] = useState(null);
  const [isMouseDown, setIsMouseDown] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const handleOutside = (e) => {
      if (ref.current && !ref.current.contains(e.target)) {
        setOpen(false);
        setIsMouseDown(false);
      }
    };
    document.addEventListener('mousedown', handleOutside);
    document.addEventListener('touchstart', handleOutside);
    return () => {
      document.removeEventListener('mousedown', handleOutside);
      document.removeEventListener('touchstart', handleOutside);
    };
  }, []);

  const monthNames = [
    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
  ];

  const prevMonth = (e) => {
    if(e) e.stopPropagation();
    if (viewMonth === 0) {
      setViewMonth(11);
      setViewYear(viewYear - 1);
    } else {
      setViewMonth(viewMonth - 1);
    }
  };

  const nextMonth = (e) => {
    if(e) e.stopPropagation();
    if (viewMonth === 11) {
      setViewMonth(0);
      setViewYear(viewYear + 1);
    } else {
      setViewMonth(viewMonth + 1);
    }
  };

  const toYMD = (year, month, day) => {
    return year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
  };

  const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0 = Minggu
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const handleDateClick = (ymd) => {
    if (!dragStart) {
      setDragStart(ymd);
      setHoverDate(ymd);
    } else {
      let d1 = dragStart;
      let d2 = ymd;
      if (d1 > d2) {
        const tmp = d1;
        d1 = d2;
        d2 = tmp;
      }
      onChange({ dari: d1, sampai: d2 });
      setDragStart(null);
      setHoverDate(null);
      setOpen(false);
    }
  };

  const handleMouseDown = (ymd) => {
    setIsMouseDown(true);
    setDragStart(ymd);
    setHoverDate(ymd);
  };

  const handleMouseEnter = (ymd) => {
    if (isMouseDown || dragStart) {
      setHoverDate(ymd);
    }
  };

  const handleMouseUp = (ymd) => {
    if (isMouseDown && dragStart && dragStart !== ymd) {
      let d1 = dragStart;
      let d2 = ymd;
      if (d1 > d2) {
        const tmp = d1;
        d1 = d2;
        d2 = tmp;
      }
      onChange({ dari: d1, sampai: d2 });
      setDragStart(null);
      setHoverDate(null);
      setOpen(false);
    }
    setIsMouseDown(false);
  };

  // Sentuhan geser (Touch Drag) di ponsel
  const handleTouchMove = (e) => {
    if (!isMouseDown && !dragStart) return;
    const touch = e.touches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    if (target && target.dataset && target.dataset.ymd) {
      setHoverDate(target.dataset.ymd);
    }
  };

  const handleTouchEnd = () => {
    if (dragStart && hoverDate) {
      let d1 = dragStart;
      let d2 = hoverDate;
      if (d1 > d2) {
        const tmp = d1;
        d1 = d2;
        d2 = tmp;
      }
      onChange({ dari: d1, sampai: d2 });
      setDragStart(null);
      setHoverDate(null);
      setOpen(false);
    }
    setIsMouseDown(false);
  };

  const applyPreset = (preset, e) => {
    if(e) e.stopPropagation();
    const now = new Date();
    const todayStr = toYMD(now.getFullYear(), now.getMonth(), now.getDate());
    if (preset === 'today') {
      onChange({ dari: todayStr, sampai: todayStr });
    } else if (preset === '7d') {
      const past = new Date(now.getTime() - 6 * 86400000);
      onChange({ dari: toYMD(past.getFullYear(), past.getMonth(), past.getDate()), sampai: todayStr });
    } else if (preset === '30d') {
      const past = new Date(now.getTime() - 29 * 86400000);
      onChange({ dari: toYMD(past.getFullYear(), past.getMonth(), past.getDate()), sampai: todayStr });
    } else if (preset === 'month') {
      const first = toYMD(now.getFullYear(), now.getMonth(), 1);
      const last = toYMD(now.getFullYear(), now.getMonth() + 1, 0);
      onChange({ dari: first, sampai: last });
    } else if (preset === 'all') {
      onChange({ dari: '', sampai: '' });
    }
    setDragStart(null);
    setHoverDate(null);
    setOpen(false);
  };

  const clearFilter = (e) => {
    e.stopPropagation();
    onChange({ dari: '', sampai: '' });
    setDragStart(null);
    setHoverDate(null);
  };

  // Hitung rentang seleksi aktif
  let activeStart = dari;
  let activeEnd = sampai;
  if (dragStart && hoverDate) {
    activeStart = dragStart < hoverDate ? dragStart : hoverDate;
    activeEnd = dragStart > hoverDate ? dragStart : hoverDate;
  }

  const displayText = () => {
    if (dari && sampai) {
      return dari === sampai ? tgl(dari) : (tgl(dari) + ' – ' + tgl(sampai));
    }
    if (dari) return 'Mulai ' + tgl(dari);
    if (sampai) return 'Sampai ' + tgl(sampai);
    return 'Semua Rentang Tanggal';
  };

  // Render sel-sel tanggal kalender
  const cells = [];
  // Hari kosong awal bulan
  for (let i = 0; i < firstDay; i++) {
    cells.push(h('div', { key: 'empty-' + i, className: 'h-8' }));
  }
  // Hari dalam bulan
  for (let day = 1; day <= daysInMonth; day++) {
    const ymd = toYMD(viewYear, viewMonth, day);
    const isStart = activeStart === ymd;
    const isEnd = activeEnd === ymd;
    const inRange = activeStart && activeEnd && ymd >= activeStart && ymd <= activeEnd;

    let cellClass = 'h-8 w-8 text-xs font-bold rounded-lg flex items-center justify-center cursor-pointer transition-colors relative ';
    if (isStart || isEnd) {
      cellClass += 'bg-black text-white shadow-[1px_1px_0_0_#ffd23f] z-10';
    } else if (inRange) {
      cellClass += 'bg-canary text-black';
    } else {
      cellClass += 'hover:bg-slate-100 text-slate-800';
    }

    cells.push(h('div', {
      key: ymd,
      'data-ymd': ymd,
      onClick: () => handleDateClick(ymd),
      onMouseDown: () => handleMouseDown(ymd),
      onMouseEnter: () => handleMouseEnter(ymd),
      onMouseUp: () => handleMouseUp(ymd),
      className: cellClass
    }, day));
  }

  return h('div', { ref: ref, className: 'relative' },
    // Kotak Input Tunggal
    h('div', {
      onClick: () => setOpen(!open),
      className: 'nb-in flex items-center justify-between cursor-pointer select-none bg-white',
      style: { boxShadow: open ? '3px 3px 0 0 #ff3d81' : 'none' }
    },
      h('div', { className: 'flex items-center gap-2 truncate' },
        h('span', { className: 'text-sm' }, '📅'),
        h('span', { className: 'text-xs font-bold text-slate-900 truncate' }, displayText())
      ),
      h('div', { className: 'flex items-center gap-1.5 flex-shrink-0' },
        (dari || sampai) ? h('button', {
          type: 'button',
          onClick: clearFilter,
          className: 'w-5 h-5 rounded-full bg-slate-200 hover:bg-coral hover:text-white flex items-center justify-center text-[10px] font-black border-0 cursor-pointer',
          title: 'Hapus filter tanggal'
        }, '✕') : null,
        h('span', { className: 'text-[9px] text-slate-500' }, open ? '▲' : '▼')
      )
    ),

    // Popover Kalender Interaktif
    open ? h('div', {
      className: 'absolute left-0 top-full mt-2 z-50 bg-white border-2 border-black rounded-xl p-3 shadow-[6px_6px_0_0_#111] w-[295px] sm:w-[325px] space-y-2.5 animate-fadeIn',
      onTouchMove: handleTouchMove,
      onTouchEnd: handleTouchEnd
    },
      // Header Kalender (Navigasi Bulan & Tahun)
      h('div', { className: 'flex items-center justify-between pb-1 border-b border-slate-200' },
        h('button', {
          type: 'button',
          onClick: prevMonth,
          className: 'ico-btn text-xs w-7 h-7 flex items-center justify-center shadow-[1px_1px_0_0_#111]'
        }, '◀'),
        h('span', { className: 'font-extrabold text-xs text-slate-900' }, monthNames[viewMonth] + ' ' + viewYear),
        h('button', {
          type: 'button',
          onClick: nextMonth,
          className: 'ico-btn text-xs w-7 h-7 flex items-center justify-center shadow-[1px_1px_0_0_#111]'
        }, '▶')
      ),

      // Header Nama Hari (Min, Sen, Sel, ...)
      h('div', { className: 'grid grid-cols-7 text-center text-[10px] font-black text-slate-500 uppercase' },
        ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].map((d, i) => h('div', { key: d, className: i === 0 ? 'text-coral' : '' }, d))
      ),

      // Grid Sel Tanggal
      h('div', { className: 'grid grid-cols-7 gap-1 text-center select-none' }, cells),

      // Petunjuk Interaktif Drag / Klik
      h('p', { className: 'text-[10px] text-slate-500 text-center font-medium italic' },
        dragStart ? 'Pilih atau geser ke tanggal akhir' : 'Klik/geser tanggal mulai hingga tanggal selesai'
      ),

      // Tombol Pintas Cepat (Hari Ini, 7 Hari, Bulan Ini, Semua)
      h('div', { className: 'pt-1.5 border-t border-slate-200 flex flex-wrap gap-1 justify-center' },
        h('button', { type: 'button', onClick: (e) => applyPreset('today', e), className: 'tag canary text-[10px] py-0.5 px-2 font-bold cursor-pointer' }, 'Hari Ini'),
        h('button', { type: 'button', onClick: (e) => applyPreset('7d', e), className: 'tag mint text-[10px] py-0.5 px-2 font-bold cursor-pointer' }, '7 Hari Terakhir'),
        h('button', { type: 'button', onClick: (e) => applyPreset('month', e), className: 'tag lilac text-[10px] py-0.5 px-2 font-bold cursor-pointer' }, 'Bulan Ini'),
        h('button', { type: 'button', onClick: (e) => applyPreset('all', e), className: 'tag text-[10px] py-0.5 px-2 font-bold cursor-pointer bg-slate-100' }, 'Semua Tanggal')
      )
    ) : null
  );
}


// Komponen Panel Kelola Kegiatan Kas (Multi-Buku Kas / Multi-Workspace)
function KegiatanManagementPanel({ kegiatanList, activeKegiatanId, onSwitch, onAdd, onRename, onDelete, onClose, notify }) {
  const [newNama, setNewNama] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editNama, setEditNama] = useState('');
  const [err, setErr] = useState('');

  const handleAdd = (e) => {
    if (e) e.preventDefault();
    setErr('');
    const n = newNama.trim();
    if (!n) {
      setErr('Nama kegiatan tidak boleh kosong.');
      return;
    }
    if (kegiatanList.some(k => k.nama.toLowerCase() === n.toLowerCase())) {
      setErr('Nama kegiatan "' + n + '" sudah terdaftar.');
      return;
    }
    onAdd(n);
    setNewNama('');
  };

  const handleSaveRename = (id) => {
    setErr('');
    const n = editNama.trim();
    if (!n) {
      setErr('Nama kegiatan tidak boleh kosong.');
      return;
    }
    if (kegiatanList.some(k => k.id !== id && k.nama.toLowerCase() === n.toLowerCase())) {
      setErr('Nama kegiatan "' + n + '" sudah digunakan kegiatan lain.');
      return;
    }
    onRename(id, n);
    setEditingId(null);
    setEditNama('');
  };

  return h('div', { className: 'nb-card p-3 sm:p-4 border-2 border-black bg-white shadow-[4px_4px_0_0_#111] no-print space-y-3 my-2.5 animate-fadeIn' },
    // Header Panel Bersih & Rapi (Anti-Terpotong & 1 Baris Seimbang)
    h('div', { className: 'flex justify-between items-center gap-2 pb-2.5 border-b-2 border-black' },
      h('div', { className: 'flex items-center gap-2 min-w-0 flex-1' },
        h('h3', { className: 'text-sm sm:text-base font-extrabold tracking-tight truncate' }, '📁 Kelola Kegiatan')
      ),
      h('div', { className: 'flex items-center gap-2 flex-shrink-0' },
        h('span', { className: 'tag canary text-[10px] sm:text-xs py-0.5 px-2.5 font-bold whitespace-nowrap flex-shrink-0' }, kegiatanList.length + ' Kegiatan'),
        h('button', {
          type: 'button',
          onClick: onClose,
          className: 'w-7 h-7 sm:w-8 sm:h-8 rounded-lg border-2 border-black bg-white hover:bg-coral hover:text-white flex items-center justify-center font-black text-xs sm:text-sm shadow-[2px_2px_0_0_#111] cursor-pointer flex-shrink-0 transition-all',
          title: 'Tutup Panel'
        }, '✕')
      )
    ),

    err ? h('div', { className: 'p-2.5 rounded-lg border-2 border-black text-xs font-bold shadow-[2px_2px_0_0_#111]', style: { backgroundColor: '#ff6b5e', color: '#111111' } },
      '⚠️ ' + err
    ) : null,

    // Form Tambah Kegiatan Baru
    h('form', { onSubmit: handleAdd, className: 'p-3 rounded-xl border-2 border-black bg-cream shadow-[2px_2px_0_0_#111] space-y-2' },
      h('div', { className: 'flex items-center justify-between pb-1 border-b border-black/10' },
        h('span', { className: 'text-[11px] font-black uppercase tracking-wider text-slate-800' }, '+ Buat Kegiatan / Buku Kas Baru'),
        h('span', { className: 'text-[10px] text-slate-500 font-bold' }, 'Pemisahan Pembukuan')
      ),
      h('div', { className: 'flex gap-2 items-center' },
        h('input', {
          type: 'text',
          value: newNama,
          placeholder: 'Contoh: Kegiatan 2, Bazar Ramadhan, Renovasi...',
          onChange: e => setNewNama(e.target.value),
          className: 'nb-in text-xs flex-1 h-9 min-h-0'
        }),
        h('button', {
          type: 'submit',
          className: 'nb-btn mint text-xs py-1.5 px-4 font-bold shadow-[2px_2px_0_0_#111] h-9 min-h-0 whitespace-nowrap'
        }, '+ Tambahkan')
      )
    ),

    // Daftar Kegiatan yang Tersimpan
    h('div', { className: 'space-y-1.5 pt-1' },
      h('div', { className: 'text-[11px] font-extrabold uppercase tracking-wider text-slate-800 mb-1' }, 'Daftar Semua Kegiatan:'),
      kegiatanList.map(k => {
        const isCurrent = k.id === activeKegiatanId;
        const isEditing = editingId === k.id;

        return h('div', {
          key: k.id,
          className: `p-2.5 rounded-lg border-2 border-black bg-white shadow-[2px_2px_0_0_#111] space-y-2 ${isCurrent ? 'ring-2 ring-black' : ''}`
        },
          h('div', { className: 'flex items-center justify-between gap-2' },
            isEditing ? h('div', { className: 'flex gap-2 items-center flex-1' },
              h('input', {
                type: 'text',
                value: editNama,
                onChange: e => setEditNama(e.target.value),
                className: 'nb-in text-xs py-1 px-2 h-8 min-h-0 flex-1'
              }),
              h('button', {
                type: 'button',
                onClick: () => handleSaveRename(k.id),
                className: 'nb-btn mint text-[10px] px-2.5 py-1 font-bold h-8 min-h-0'
              }, 'Simpan'),
              h('button', {
                type: 'button',
                onClick: () => { setEditingId(null); setEditNama(''); },
                className: 'nb-btn text-[10px] px-2 py-1 h-8 min-h-0'
              }, 'Batal')
            ) : h('div', { className: 'flex items-center gap-2 min-w-0 flex-1' },
              h('span', { className: 'text-sm' }, isCurrent ? '📌' : '📁'),
              h('span', { className: 'font-extrabold text-xs text-slate-900 truncate' }, k.nama),
              isCurrent ? h('span', { className: 'tag mint text-[9px] py-0 px-1.5 font-bold' }, 'Sedang Aktif') : null
            ),

            !isEditing ? h('div', { className: 'flex items-center gap-1.5 flex-shrink-0' },
              !isCurrent ? h('button', {
                type: 'button',
                onClick: () => onSwitch(k.id),
                className: 'nb-btn canary text-[10px] px-2.5 py-1 font-bold h-7 min-h-0'
              }, 'Buka') : null,
              h('button', {
                type: 'button',
                onClick: () => { setEditingId(k.id); setEditNama(k.nama); },
                className: 'ico-btn canary text-xs w-7 h-7 min-h-0',
                title: 'Ganti Nama Kegiatan'
              }, '✏️'),
              kegiatanList.length > 1 ? h('button', {
                type: 'button',
                onClick: () => onDelete(k.id, k.nama),
                className: 'ico-btn coral text-xs w-7 h-7 min-h-0',
                title: 'Hapus Kegiatan'
              }, '🗑️') : null
            ) : null
          )
        );
      })
    )
  );
}

// Pelindung Galat React (ErrorBoundary)
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error: error };
  }
  componentDidCatch(error, errorInfo) {
    console.error('ErrorBoundary caught:', error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return React.createElement('div', {
        style: {
          minHeight: '100vh',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          padding: '16px',
          backgroundColor: 'var(--cream, #fdf9f0)'
        }
      },
        React.createElement('div', {
          className: 'nb-card',
          style: {
            background: '#fff',
            border: '2px solid #111',
            borderRadius: '16px',
            boxShadow: '6px 6px 0 0 #111',
            padding: '24px',
            maxWidth: '420px',
            width: '100%',
            textAlign: 'center'
          }
        },
          React.createElement('span', {
            className: 'tag coral',
            style: { display: 'inline-block', marginBottom: '12px' }
          }, 'Terjadi Kendala Tampilan'),
          React.createElement('h3', { style: { margin: '8px 0', fontSize: '18px', fontWeight: 800 } }, 'Memulihkan Aplikasi'),
          React.createElement('p', { style: { fontSize: '13px', color: '#555', marginBottom: '16px' } },
            (this.state.error && this.state.error.message) ? this.state.error.message : 'Silakan klik tombol di bawah untuk memuat ulang data.'
          ),
          React.createElement('button', {
            onClick: () => {
              this.setState({ hasError: false, error: null });
              try { safeStorage.removeItem(SESSION_KEY); } catch(e){}
              window.location.reload();
            },
            className: 'nb-btn mint',
            style: { cursor: 'pointer', padding: '10px 20px', fontWeight: 800 }
          }, 'Muat Ulang Halaman')
        )
      );
    }
    return this.props.children;
  }
}

              className: 'nb-btn w-full text-left p-2.5 text-xs font-bold shadow-[2px_2px_0_0_#111] flex items-center gap-2.5 hover:bg-canary hover:translate-x-0.5 transition-all'
            },
              h('span', { className: 'text-base' }, '⚙️'),
              h('span', { className: 'flex-1 font-bold' }, 'Pengaturan Web & Auto-Logout')
            )
          )
        ) : null
      ),

      // Bagian Bawah: Reset Data & Tombol Keluar
      h('div', { className: 'pt-3 border-t-2 border-black space-y-2' },
        h('button', {
          type: 'button',
          onClick: () => { onClose(); openFeature('reset'); },
          className: 'w-full text-left px-3 py-2 text-xs font-bold rounded-lg border-2 border-black bg-white hover:bg-coral hover:text-black flex items-center gap-2 shadow-[2px_2px_0_0_#111] cursor-pointer transition-all',
          style: { color: '#e11d48' }
        },
          h('span', null, '🗑️'),
          h('span', null, 'Reset Semua Data Kas')
        ),
        h('button', {
          type: 'button',
          onClick: () => { onClose(); onLogout(); },
          className: 'nb-btn coral w-full py-2.5 text-xs font-black shadow-[3px_3px_0_0_#111] flex items-center justify-center gap-2'
        },
          h('span', null, '🚪'),
          h('span', null, 'Keluar dari Akun')
        )
      )
    )
  );
}

function App(){
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [sessionExpiredMsg, setSessionExpiredMsg] = useState('');

  // HARUS LOGIN saat pertama kali membuka web aplikasi:
  // Hanya pulihkan sesi jika ada data login dan waktu tidak aktif belum melewati batas
  const [currentUser, setCurrentUser] = useState(() => {
    try {
      const sessStr = safeStorage.getItem(SESSION_KEY);
      if(sessStr){
        const sess = JSON.parse(sessStr);
        const lastActive = Number(sess.lastActive) || 0;
        const now = Date.now();
        const maxDuration = (Number(sess.timeoutMinutes) || 15) * 60 * 1000;
        if(lastActive > 0 && (now - lastActive) < maxDuration){
          return sess.user || { username: sess.username, role: sess.role || 'admin' };
        } else {
          safeStorage.removeItem(SESSION_KEY);
        }
      }
    }catch(e){}
    return null; // Awal membuka web: WAJIB LOGIN!
  });
  const [authChecked, setAuthChecked] = useState(true);

  // Pilihan Mode Tampilan: 'table' (Tabel Asli) atau 'card' (Kartu Vertikal)
  const [viewMode, setViewMode] = useState(() => {
    try {
      return safeStorage.getItem('buku-kas-view-mode') || 'table';
    } catch(e) {
      return 'table';
    }
  });

  const handleSetViewMode = (mode) => {
    setViewMode(mode);
    try {
      safeStorage.setItem('buku-kas-view-mode', mode);
    } catch(e) {}
    notify(mode === 'table' ? 'Beralih ke Mode Tampilan Tabel' : 'Beralih ke Mode Tampilan Kartu');
  };

  // Pengaturan Multi-Kegiatan Kas (Multi-Buku Kas / Multi-Workspace)
  const [kegiatanList, setKegiatanList]=useState([
    { id: 'k1', nama: 'Kegiatan 1', createdAt: Date.now() }
  ]);
  const [activeKegiatanId, setActiveKegiatanId]=useState('k1');
  const [kegiatanModalOpen, setKegiatanModalOpen]=useState(false);
  const [kegiatanMenuOpen, setKegiatanMenuOpen]=useState(false);
  const kegiatanMenuRef=useRef(null);

  const currentKegiatan = useMemo(() => {
    return kegiatanList.find(k => k.id === activeKegiatanId) || kegiatanList[0] || { id: 'k1', nama: 'Kegiatan 1' };
  }, [kegiatanList, activeKegiatanId]);

  // Pengaturan Tautan Google Spreadsheet
  const [sheetConfig, setSheetConfig]=useState(null);
  const [configLoaded, setConfigLoaded]=useState(false);
  const [sheetModalOpen, setSheetModalOpen]=useState(false);

  // Pengaturan Profil & Identitas Aplikasi (Web Settings)
  const [appSettings, setAppSettings]=useState({
    appName: 'BUKU DEBET KREDIT',
    currencySymbol: 'Rp',
    pdfFooter: 'Buku Debet Kredit Standar UMKM',
    themeColor: 'pink',
    autoLogoutMinutes: 15
  });
  const [settingsModalOpen, setSettingsModalOpen]=useState(false);

  // Dropdown menu alat data (Impor, Ekspor, Reset, Pengaturan)
  const [toolsMenuOpen, setToolsMenuOpen]=useState(false);
  const toolsMenuRef=useRef(null);

  const [txs,setTxs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [f,setF]=useState(empty());
  const [editId,setEditId]=useState(null);
  const [err,setErr]=useState({});
  const [flt,setFlt]=useState({dari:'',sampai:'',q:'',jenis:'ALL'});
  const [modal,setModal]=useState(null);
  const [userModalOpen, setUserModalOpen]=useState(false);
  const [impTeks,setImpTeks]=useState('');
  const [impMsg,setImpMsg]=useState(null);
  const [toast,setToast]=useState(null);

  const notify=(text,type='success')=>{
    setToast({text,type});
    setTimeout(()=>setToast(null),3200);
  };

  // Fungsi pengalih panel otomatis: menutup panel sebelumnya saat fitur lain dibuka
  const closeAllPanels=()=>{
    setUserModalOpen(false);
    setSheetModalOpen(false);
    setSettingsModalOpen(false);
    setKegiatanModalOpen(false);
    setModal(null);
  };

  // Fungsi scroll otomatis ke form tambah transaksi saat FAB (+) diklik
  const scrollToForm=()=>{
    closeAllPanels();
    if(editId) cancel();
    const el = document.getElementById('form-transaksi');
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'start' });
      const inp = el.querySelector('input[placeholder*="Penjualan"]');
      if(inp){
        setTimeout(() => inp.focus(), 320);
      }
    }
  };

  const openFeature=(featType, data=null)=>{
    setSidebarOpen(false);
    // Jika fitur yang sama diklik kembali, tutup (toggle)
    if(featType === 'user'){
      const next = !userModalOpen;
      closeAllPanels();
      setUserModalOpen(next);
    } else if(featType === 'sheet'){
      const next = !sheetModalOpen;
      closeAllPanels();
      setSheetModalOpen(next);
    } else if(featType === 'settings'){
      const next = !settingsModalOpen;
      closeAllPanels();
      setSettingsModalOpen(next);
    } else if(featType === 'kegiatan'){
      const next = !kegiatanModalOpen;
      closeAllPanels();
      setKegiatanModalOpen(next);
    } else {
      // Untuk modal pdf, impor, csv, reset, del
      const isAlreadyOpen = modal && modal.t === featType;
      closeAllPanels();
      if(!isAlreadyOpen){
        setModal(Object.assign({ t: featType }, data || {}));
      }
    }
  };

  // 1. Cek sesi login saat halaman dimuat (Wajib login jika sesi kosong atau kedaluwarsa)
  useEffect(()=>{
    try{
      const sessStr = safeStorage.getItem(SESSION_KEY);
      if(sessStr){
        const sess = JSON.parse(sessStr);
        const lastActive = Number(sess.lastActive) || 0;
        const now = Date.now();
        const maxDuration = (Number(sess.timeoutMinutes) || 15) * 60 * 1000;
        if(lastActive > 0 && (now - lastActive) < maxDuration){
          setCurrentUser(sess.user || { username: sess.username, role: sess.role || 'admin' });
        } else {
          setCurrentUser(null);
          safeStorage.removeItem(SESSION_KEY);
          setSessionExpiredMsg('Sesi Anda telah kedaluwarsa karena tidak digunakan. Silakan masuk kembali.');
        }
      } else {
        setCurrentUser(null);
      }
    }catch(e){
      setCurrentUser(null);
    }
    setAuthChecked(true);
  },[]);

  const lastActiveRef = useRef(Date.now());

  // 1.05 Pemantau Aktivitas Pengguna & Auto-Logout jika Tidak Digunakan
  useEffect(() => {
    if (!currentUser) return;

    lastActiveRef.current = Date.now();
    const mins = Number(appSettings.autoLogoutMinutes) || 15;
    const timeoutMs = mins * 60 * 1000;

    const recordActivity = () => {
      const now = Date.now();
      // Throttle pencatatan aktivitas setiap 2.5 detik
      if (now - lastActiveRef.current > 2500) {
        lastActiveRef.current = now;
        try {
          const sessStr = safeStorage.getItem(SESSION_KEY);
          if (sessStr) {
            const sess = JSON.parse(sessStr);
            sess.lastActive = now;
            sess.timeoutMinutes = mins;
            safeStorage.setItem(SESSION_KEY, JSON.stringify(sess));
          }
        } catch(e) {}
      }
    };

    const events = ['mousedown', 'mousemove', 'keydown', 'touchstart', 'scroll', 'click'];
    events.forEach(evt => window.addEventListener(evt, recordActivity, { passive: true }));

    // Cek ketidakaktifan setiap 5 detik
    const checkTimer = setInterval(() => {
      const now = Date.now();
      const idleTime = now - lastActiveRef.current;
      if (idleTime >= timeoutMs) {
        clearInterval(checkTimer);
        // Otomatis keluar karena waktu tidak aktif tercapai
        setCurrentUser(null);
        safeStorage.removeItem(SESSION_KEY);
        const expiredNotice = 'Sesi Anda telah berakhir otomatis karena tidak digunakan selama ' + mins + ' menit. Silakan masuk kembali.';
        setSessionExpiredMsg(expiredNotice);
        notify(expiredNotice, 'error');
      }
    }, 5000);

    return () => {
      events.forEach(evt => window.removeEventListener(evt, recordActivity));
      clearInterval(checkTimer);
    };
  }, [currentUser, appSettings.autoLogoutMinutes]);

  // 1.0 Sinkronisasi Daftar Kegiatan Kas dari Firebase (dengan Auto-Migrasi Data Lama)
  useEffect(()=>{
    if(kegiatanListRef){
      kegiatanListRef.on('value', snapshot => {
        const val = snapshot.val();
        if(val && Array.isArray(val) && val.length > 0){
          setKegiatanList(val);
          setActiveKegiatanId(currId => {
            if(val.some(k => k.id === currId)) return currId;
            return val[0].id;
          });
        } else if(!val) {
          // Buat kegiatan bawaan "Kegiatan 1" dan migrasikan transaksi lama jika ada
          const defaultList = [{ id: 'k1', nama: 'Kegiatan 1', createdAt: Date.now() }];
          if(txsRef){
            txsRef.once('value').then(txSnap => {
              const oldTxs = txSnap.val();
              if(oldTxs && Array.isArray(oldTxs) && oldTxs.length > 0){
                if(kegiatanDataRef){
                  kegiatanDataRef.child('k1').child('transactions').set(oldTxs);
                }
              }
            });
          }
          kegiatanListRef.set(defaultList);
          setKegiatanList(defaultList);
        }
      });
    }
  },[]);

  // 1.1 Sinkronisasi Pengaturan Google Spreadsheet & Web Settings dari Firebase
  useEffect(()=>{
    if(configRef){
      configRef.on('value', snapshot => {
        const val = snapshot.val() || {};
        if(val.sheetUrl || val.scriptUrl){
          setSheetConfig({ sheetUrl: val.sheetUrl, scriptUrl: val.scriptUrl, updatedAt: val.updatedAt });
        } else {
          setSheetConfig(null);
        }
        if(val.settings){
          setAppSettings(Object.assign({
            appName: 'BUKU DEBET KREDIT',
            currencySymbol: 'Rp',
            pdfFooter: 'Buku Debet Kredit Standar UMKM',
            themeColor: 'pink'
          }, val.settings));
        }
        setConfigLoaded(true);
      }, err => {
        console.warn('Config sync error:', err);
        setConfigLoaded(true);
      });
    } else {
      setConfigLoaded(true);
    }
  },[]);

  const saveAppSettings=(newStg)=>{
    setAppSettings(newStg);
    if(configRef){
      configRef.child('settings').set(newStg).then(()=>{
        notify('Pengaturan aplikasi berhasil disimpan!');
      }).catch(err=>{
        console.warn('Gagal simpan pengaturan:', err);
        notify('Gagal menyimpan pengaturan ke Firebase!', 'error');
      });
    }
  };

  // Tutup dropdown menu alat data & menu kegiatan jika klik di luar
  useEffect(()=>{
    const handleOutside = (e) => {
      if(toolsMenuRef.current && !toolsMenuRef.current.contains(e.target)){
        setToolsMenuOpen(false);
      }
      if(kegiatanMenuRef.current && !kegiatanMenuRef.current.contains(e.target)){
        setKegiatanMenuOpen(false);
      }
    };
    document.addEventListener('mousedown', handleOutside);
    document.addEventListener('touchstart', handleOutside);
    return () => {
      document.removeEventListener('mousedown', handleOutside);
      document.removeEventListener('touchstart', handleOutside);
    };
  },[]);

  const [isCloudOnline, setIsCloudOnline]=useState(false);

  // 2. Sinkronisasi Data Transaksi Kegiatan Terpilih dengan Firebase Realtime Database (100% Cloud)
  useEffect(()=>{
    if(!currentUser) {
      setLoading(false);
      return;
    }
    setLoading(true);

    const timer = setTimeout(() => {
      setLoading(false);
    }, 2000);

    if(fbDb){
      fbDb.ref('.info/connected').on('value', snap => {
        setIsCloudOnline(Boolean(snap.val()));
      });
    }

    // Arahkan ke cabang data transaksi kegiatan aktif
    const currentTxsRef = (kegiatanDataRef && activeKegiatanId) ? kegiatanDataRef.child(activeKegiatanId).child('transactions') : txsRef;

    if(currentTxsRef){
      currentTxsRef.on('value', snapshot => {
        clearTimeout(timer);
        const val = snapshot.val();
        setIsCloudOnline(true);
        setLoading(false);
        if(val && Array.isArray(val)){
          setTxs(val);
        } else if(!val) {
          currentTxsRef.set([]);
          setTxs([]);
        }
      }, err => {
        clearTimeout(timer);
        console.warn('Firebase sync error:', err);
        setIsCloudOnline(false);
        setLoading(false);
      });
    } else {
      clearTimeout(timer);
      setLoading(false);
    }

    return () => {
      clearTimeout(timer);
      if(currentTxsRef) currentTxsRef.off('value');
    };
  },[currentUser, activeKegiatanId]);

  // Fungsi Pengiriman Data Real-time ke Google Spreadsheet via Apps Script
  const syncToGoogleSheets=(action, itemsList, targetScriptUrl)=>{
    const url = targetScriptUrl || (sheetConfig && sheetConfig.scriptUrl);
    if(!url) return;
    try {
      const payload = {
        action: action,
        items: (itemsList || []).map((t, idx) => ({
          no: idx + 1,
          tanggal: t.tanggal,
          ket: t.ket,
          jenis: t.jenis,
          jumlah: t.jumlah,
          saldo: t.saldo
        }))
      };
      fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        cache: 'no-cache',
        body: JSON.stringify(payload)
      }).then(() => {
        console.log('Sinkronisasi otomatis ke Google Sheets berhasil dikirim!');
      }).catch(err => console.warn('Gagal sync otomatis ke Sheets:', err));
    } catch(e){}
  };

  const saveSheetConfig=(cfg)=>{
    setSheetConfig(cfg);
    if(configRef){
      configRef.set(cfg).catch(err => {
        console.warn('Config save error:', err);
        notify('Gagal menyimpan tautan ke Firebase! Periksa rules.', 'error');
      });
    }
    if(cfg.scriptUrl && rows.length > 0){
      syncToGoogleSheets('sync_all', rows, cfg.scriptUrl);
    }
  };

  // Fungsi Manajemen Kegiatan (Tambah, Ganti Nama, Hapus)
  const handleAddKegiatan = (namaBaru) => {
    const newId = 'k_' + Date.now();
    const updated = kegiatanList.concat([{ id: newId, nama: namaBaru, createdAt: Date.now() }]);
    setKegiatanList(updated);
    if(kegiatanListRef) kegiatanListRef.set(updated);
    if(kegiatanDataRef) kegiatanDataRef.child(newId).child('transactions').set([]);
    setActiveKegiatanId(newId);
    notify('Kegiatan baru "' + namaBaru + '" berhasil dibuat!');
  };

  const handleRenameKegiatan = (id, namaBaru) => {
    const updated = kegiatanList.map(k => k.id === id ? Object.assign({}, k, { nama: namaBaru }) : k);
    setKegiatanList(updated);
    if(kegiatanListRef) kegiatanListRef.set(updated);
    notify('Nama kegiatan diperbarui menjadi "' + namaBaru + '"');
  };

  const handleDeleteKegiatan = (id, nama) => {
    if(kegiatanList.length <= 1){
      notify('Minimal harus ada 1 kegiatan kas aktif!', 'error');
      return;
    }
    if(!confirm('Hapus kegiatan "' + nama + '" dan seluruh riwayat transaksinya?')){
      return;
    }
    const updated = kegiatanList.filter(k => k.id !== id);
    setKegiatanList(updated);
    if(kegiatanListRef) kegiatanListRef.set(updated);
    if(kegiatanDataRef) kegiatanDataRef.child(id).remove();
    if(activeKegiatanId === id){
      setActiveKegiatanId(updated[0].id);
    }
    notify('Kegiatan "' + nama + '" telah dihapus.');
  };

  const save=list=>{
    setTxs(list);
    const currentTxsRef = (kegiatanDataRef && activeKegiatanId) ? kegiatanDataRef.child(activeKegiatanId).child('transactions') : txsRef;
    if(currentTxsRef){
      currentTxsRef.set(list).catch(err => {
        console.warn('Firebase save error:', err);
        notify('Gagal menyimpan transaksi ke Firebase! Periksa aturan database.', 'error');
      });
    }
    // Otomatis sinkronkan juga ke Google Spreadsheet jika script URL sudah terdaftar
    if(sheetConfig && sheetConfig.scriptUrl){
      const s = [...list].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)||a.id-b.id);
      let sal = 0;
      const sortedRows = s.map(t=>{ sal += (t.jenis==='D'?t.jumlah:-t.jumlah); return Object.assign({}, t, { saldo: sal }); });
      syncToGoogleSheets('sync_all', sortedRows);
    }
  };

  const handleLoginSuccess=(user)=>{
    setCurrentUser(user);
    setSessionExpiredMsg('');
    lastActiveRef.current = Date.now();
    const mins = Number(appSettings.autoLogoutMinutes) || 15;
    const sessData = {
      user: user,
      username: user.username,
      name: user.name,
      role: user.role,
      lastActive: Date.now(),
      timeoutMinutes: mins
    };
    try{ safeStorage.setItem(SESSION_KEY, JSON.stringify(sessData)); }catch(e){}
    notify('Selamat datang kembali, @' + (user.name || user.username) + '!');
  };

  const handleLogout=()=>{
    setCurrentUser(null);
    setSessionExpiredMsg('');
    try{ safeStorage.removeItem(SESSION_KEY); }catch(e){}
    notify('Anda telah keluar dari akun.');
  };

  const rows=useMemo(()=>{
    const s=[...txs].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)||a.id-b.id);
    let saldo=0;
    return s.map(t=>{saldo+=t.jenis==='D'?t.jumlah:-t.jumlah;return Object.assign({},t,{saldo:saldo});});
  },[txs]);

  const shown=rows.filter(t=>
    (!flt.dari||t.tanggal>=flt.dari)&&(!flt.sampai||t.tanggal<=flt.sampai)&&
    (!flt.jenis||flt.jenis==='ALL'||t.jenis===flt.jenis)&&
    (!flt.q||t.ket.toLowerCase().includes(flt.q.toLowerCase())));

  const totD=txs.filter(t=>t.jenis==='D').reduce((a,t)=>a+t.jumlah,0);
  const totK=txs.filter(t=>t.jenis==='K').reduce((a,t)=>a+t.jumlah,0);
  const saldo=totD-totK;

  const submit=()=>{
    const e={};
    const n=parseInt(f.jumlah||'0',10);
    if(!f.tanggal)e.tanggal='Tanggal wajib diisi';
    if(!f.ket.trim())e.ket='Keterangan tidak boleh kosong';
    if(!(n>0))e.jumlah='Jumlah harus lebih dari 0';
    setErr(e);
    if(Object.keys(e).length)return;
    const data={tanggal:f.tanggal,ket:f.ket.trim(),jenis:f.jenis,jumlah:n};
    if(editId){
      save(txs.map(t=>t.id===editId?Object.assign({id:editId},data):t));
      notify('Perubahan disimpan & langsung disinkronkan ke Spreadsheet!');
    } else {
      save(txs.concat([Object.assign({id:Date.now()},data)]));
      notify('Transaksi baru ditambahkan & langsung disinkronkan ke Spreadsheet!');
    }
    setF(empty());setEditId(null);
  };

  const edit=t=>{closeAllPanels();setEditId(t.id);setF({tanggal:t.tanggal,ket:t.ket,jenis:t.jenis,jumlah:String(t.jumlah)});setErr({});window.scrollTo({top:0,behavior:'smooth'});};
  const cancel=()=>{setEditId(null);setF(empty());setErr({});};

  const pilihFile=e=>{
    const fl=e.target.files&&e.target.files[0];
    if(!fl)return;
    const r=new FileReader();
    r.onload=()=>{setImpTeks(String(r.result));setImpMsg(null);};
    r.onerror=()=>setImpMsg({ok:false,text:'Gagal membaca file.'});
    r.readAsText(fl);
    e.target.value='';
  };

  const doImpor=(ganti)=>{
    const r=bacaTx(impTeks);
    if(r.error){setImpMsg({ok:false,text:r.error});return;}
    let baru=r.txs,dup=0;
    if(!ganti){
      const ada=new Set(txs.map(kunci));
      baru=baru.filter(t=>{if(ada.has(kunci(t))){dup++;return false;}return true;});
    }
    if(!baru.length){setImpMsg({ok:false,text:'Tidak ada transaksi baru yang bisa diimpor'+(dup?' ('+dup+' sudah ada)':'')+'.'});return;}
    save(ganti?baru:txs.concat(baru));
    if(ganti)cancel();
    setImpTeks('');
    setImpMsg({ok:true,text:'Berhasil mengimpor '+baru.length+' transaksi'+(r.skip?', '+r.skip+' baris dilewati':'')+(dup?', '+dup+' dilewati karena duplikat':'')+'.'});
    notify('Impor data CSV berhasil!');
  };
  const tutupImpor=()=>{setModal(null);setImpMsg(null);setImpTeks('');};

  const csv=()=>{
    const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    const lines=[['Tanggal','Keterangan','Debet','Kredit','Saldo'].join(',')];
    shown.forEach(t=>lines.push([tgl(t.tanggal),q(t.ket),t.jenis==='D'?t.jumlah:0,t.jenis==='K'?t.jumlah:0,t.saldo].join(',')));
    return lines.join('\n');
  };

  const copyCsv=()=>{
    const box=document.getElementById('csvbox');
    box.select();
    try{
      navigator.clipboard.writeText(box.value);
      notify('Teks CSV berhasil disalin!');
    }catch(e){
      try{document.execCommand('copy');notify('Teks CSV berhasil disalin!');}
      catch(e2){notify('Silakan salin teks secara manual','error');}
    }
  };

  const unduhCsv=()=>{
    const text=csv();
    const blob=new Blob([text],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const kSlug = ((currentKegiatan && currentKegiatan.nama) ? currentKegiatan.nama : 'kegiatan').toLowerCase().replace(/[^a-z0-9]/g, '-');
    a.download='buku-kas-'+kSlug+'-'+today()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
    notify('File CSV berhasil diunduh!');
  };
