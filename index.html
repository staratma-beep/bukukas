const parseCsv=(text)=>{
  text=text.replace(/^\uFEFF/,'');
  const first=text.split('\n')[0]||'';
  const d=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===d){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}
    else cur+=c;
  }
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
};

const normTgl=(s)=>{
  s=(s||'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/),y,mo,da;
  if(m){y=m[1];mo=m[2];da=m[3];}
  else{m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(!m)return null;da=m[1];mo=m[2];y=m[3];}
  mo=mo.padStart(2,'0');da=da.padStart(2,'0');
  if(+mo<1||+mo>12||+da<1||+da>31)return null;
  return y+'-'+mo+'-'+da;
};

const angka=(s)=>parseInt(String(s||'').trim().replace(/[.,]00$/,'').replace(/[^\d]/g,'')||'0',10);

const bacaTx=(text)=>{
  const rows=parseCsv(text);
  if(rows.length<2)return {error:'File kosong atau hanya berisi baris judul header.'};
  const head=rows[0].map(x=>x.trim().toLowerCase());
  const iT=head.indexOf('tanggal'),iK=head.indexOf('keterangan'),iD=head.indexOf('debet'),iKr=head.indexOf('kredit');
  if(iT<0||iK<0||iD<0||iKr<0)return {error:'Baris pertama harus berisi header: Tanggal, Keterangan, Debet, Kredit.'};
  const txs=[];let skip=0;
  rows.slice(1).forEach((r,i)=>{
    const tanggal=normTgl(r[iT]),ket=(r[iK]||'').trim(),dbt=angka(r[iD]),krd=angka(r[iKr]);
    if(!tanggal||!ket||(dbt>0)===(krd>0)){skip++;return;}
    txs.push({id:Date.now()+i,tanggal:tanggal,ket:ket,jenis:dbt>0?'D':'K',jumlah:dbt>0?dbt:krd});
  });
  return {txs:txs,skip:skip};
};

function Pilih(p){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    const close=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    const esc=e=>{if(e.key==='Escape')setOpen(false);};
    document.addEventListener('mousedown',close);document.addEventListener('keydown',esc);
    return ()=>{document.removeEventListener('mousedown',close);document.removeEventListener('keydown',esc);};
  },[]);
  const cur=p.opsi.find(o=>o.v===p.value)||p.opsi[0];
  return h('div',{ref:ref,className:'relative'},
    h('button',{type:'button',onClick:()=>setOpen(!open),className:'nb-in flex items-center justify-between '+cur.c,style:{cursor:'pointer',boxShadow:open?'4px 4px 0 0 #111':'none'},'aria-haspopup':'listbox','aria-expanded':open},
      h('span',null,cur.l),
      h('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:3,strokeLinecap:'round',strokeLinejoin:'round',style:{transform:open?'rotate(180deg)':'none',transition:'transform .15s'},'aria-hidden':'true'},h('path',{d:'M6 9l6 6 6-6'}))),
    open?h('div',{className:'pilih-list',role:'listbox'},p.opsi.map(o=>h('button',{key:o.v,type:'button',role:'option','aria-selected':o.v===p.value,className:'pilih-opt'+(o.v===p.value?' '+o.c:''),onClick:()=>{p.onChange(o.v);setOpen(false);}},o.l))):null);
}

// Halaman Login & Registrasi User
// Halaman Login Bersih (Hanya Masuk, Tanpa Registrasi Publik & Tanpa Tombol Demo)
function LoginPage({onLoginSuccess, notify}){
  const [username, setUsername]=useState('');
  const [password, setPassword]=useState('');
  const [err, setErr]=useState('');

  const [usersList, setUsersList]=useState(()=>{
    try{
      const raw = localStorage.getItem(USERS_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return defaultUsers;
  });

  useEffect(()=>{
    if(usersRef){
      usersRef.on('value', snapshot => {
        const val = snapshot.val();
        if(val && Array.isArray(val) && val.length > 0){
          setUsersList(val);
          try{ localStorage.setItem(USERS_KEY, JSON.stringify(val)); }catch(e){}
        } else {
          // Inisialisasi awal ke Firebase jika masih kosong
          usersRef.set(defaultUsers);
        }
      });
    }
  },[]);

  const getUsers=()=> usersList;

  const handleLogin=(e)=>{
    if(e) e.preventDefault();
    setErr('');
    const u = username.trim().toLowerCase();
    const p = password.trim();
    if(!u || !p){
      setErr('Username dan password wajib diisi.');
      return;
    }
    const users = getUsers();
    const found = users.find(x => x.username.toLowerCase() === u && x.password === p);
    if(found){
      onLoginSuccess(found);
    } else {
      setErr('Username atau password salah.');
    }
  };

  return h('div',{className:'min-h-screen flex items-center justify-center p-4'},
    h('div',{className:'nb-card max-w-sm w-full p-6 sm:p-8',style:{background:'#fff'}},

      h('div',{className:'text-center mb-6'},
        h('div',{className:'inline-block mb-2'},
          h('span',{className:'tag pink text-xl sm:text-2xl',style:{borderRadius:'10px',padding:'.3rem .9rem',boxShadow:'4px 4px 0 0 #111'}},'Buku Debet Kredit')
        ),
        h('h2',{className:'text-lg tracking-tight mt-2'},'Masuk Akun'),
        h('p',{className:'text-xs font-semibold text-slate-500 mt-0.5'},'Hanya pengguna terdaftar yang dapat mengakses')
      ),

      // Error Alert Box
      err ? h('div',{className:'mb-4 p-2.5 rounded-lg border-2 border-black bg-coral text-white text-xs font-bold flex items-center gap-2 shadow-[2px_2px_0_0_#111]'},
        h('span',null,'⚠️'),
        h('span',null,err)
      ) : null,

      // FORM MASUK
      h('form',{onSubmit:handleLogin, className:'space-y-4'},
        h('div',null,
          h('label',{htmlFor:'login-user',className:'block text-xs font-bold uppercase mb-1'},'Username'),
          h('input',{
            id:'login-user',
            type:'text',
            value:username,
            onChange:e=>setUsername(e.target.value),
            className:'nb-in',
            autoComplete:'username'
          })
        ),
        h('div',null,
          h('label',{htmlFor:'login-pass',className:'block text-xs font-bold uppercase mb-1'},'Password'),
          h('input',{
            id:'login-pass',
            type:'password',
            value:password,
            onChange:e=>setPassword(e.target.value),
            className:'nb-in',
            autoComplete:'current-password'
          })
        ),
        h('button',{
          type:'submit',
          className:'nb-btn mint w-full py-2.5 font-bold text-sm shadow-[4px_4px_0_0_#111] mt-2'
        },'Masuk ke Buku Kas')
      )
    )
  );
}

// Modal Kelola Pengguna (Hanya untuk Admin)
// Komponen Panel Kelola Pengguna Terintegrasi (Bisa Buka-Tutup, Tanpa Pop-up, Tanpa Nama Lengkap)
// Komponen Panel Kelola Pengguna & Ganti Password (Menyatu dalam halaman, bisa buka-tutup)
function UserManagementPanel({currentUser, onClose, notify, onUpdateCurrentUser}){
  const [users, setUsers]=useState(()=>{
    try{
      const raw = localStorage.getItem(USERS_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return defaultUsers;
  });

  useEffect(()=>{
    if(usersRef){
      usersRef.on('value', snapshot => {
        const val = snapshot.val();
        if(val && Array.isArray(val) && val.length > 0){
          setUsers(val);
          try{ localStorage.setItem(USERS_KEY, JSON.stringify(val)); }catch(e){}
        }
      });
    }
  },[]);
  
  // State untuk Tambah Pengguna Baru
  const [newUser, setNewUser]=useState('');
  const [newPass, setNewPass]=useState('');
  const [newRole, setNewRole]=useState('staf');
  
  // State untuk Ganti Password Akun Aktif
  const [currOldPass, setCurrOldPass]=useState('');
  const [currNewPass, setCurrNewPass]=useState('');
  const [currNewPassConfirm, setCurrNewPassConfirm]=useState('');
  
  // State untuk Admin Reset Password Akun Tertentu
  const [editingUserPass, setEditingUserPass]=useState(null);
  const [adminSetPass, setAdminSetPass]=useState('');

  const [err, setErr]=useState('');
  const [succ, setSucc]=useState('');

  const saveList=(list)=>{
    setUsers(list);
    try{ localStorage.setItem(USERS_KEY, JSON.stringify(list)); }catch(e){}
    if(usersRef){
      usersRef.set(list).catch(err => console.warn('Firebase write error:', err));
    }
  };

  // 1. Fungsi Ganti Password Akun Sendiri
  const handleChangeMyPassword=(e)=>{
    if(e) e.preventDefault();
    setErr('');
    setSucc('');
    const oldP = currOldPass.trim();
    const newP = currNewPass.trim();
    const newPC = currNewPassConfirm.trim();

    if(!oldP || !newP || !newPC){
      setErr('Semua kolom ganti password wajib diisi.');
      return;
    }
    // Cari user aktif di list
    const found = users.find(x => x.username.toLowerCase() === currentUser.username.toLowerCase());
    if(!found || found.password !== oldP){
      setErr('Password lama Anda salah.');
      return;
    }
    if(newP.length < 4){
      setErr('Password baru minimal 4 karakter.');
      return;
    }
    if(newP !== newPC){
      setErr('Konfirmasi password baru tidak cocok.');
      return;
    }

    const updated = users.map(u => {
      if(u.username.toLowerCase() === currentUser.username.toLowerCase()){
        return Object.assign({}, u, { password: newP });
      }
      return u;
    });

    saveList(updated);
    // Update sesi login
    const updatedUser = Object.assign({}, currentUser, { password: newP });
    onUpdateCurrentUser(updatedUser);

    setCurrOldPass('');
    setCurrNewPass('');
    setCurrNewPassConfirm('');
    setSucc('Password akun @' + currentUser.username + ' berhasil diubah!');
    notify('Password Anda berhasil diganti!');
  };

  // 2. Fungsi Admin Mengubah Password Pengguna Lain
  const handleSaveAdminSetPass=(targetUsername)=>{
    setErr('');
    setSucc('');
    const p = adminSetPass.trim();
    if(p.length < 4){
      setErr('Password minimal 4 karakter.');
      return;
    }
    const updated = users.map(u => {
      if(u.username.toLowerCase() === targetUsername.toLowerCase()){
        return Object.assign({}, u, { password: p });
      }
      return u;
    });
    saveList(updated);
    if(targetUsername.toLowerCase() === currentUser.username.toLowerCase() && onUpdateCurrentUser){
      onUpdateCurrentUser(Object.assign({}, currentUser, { password: p }));
    }
    setEditingUserPass(null);
    setAdminSetPass('');
    setSucc('Password untuk @' + targetUsername + ' berhasil diubah!');
    notify('Password @' + targetUsername + ' diperbarui.');
  };

  // 3. Fungsi Tambah Pengguna Baru
  const handleAddUser=(e)=>{
    if(e) e.preventDefault();
    setErr('');
    setSucc('');
    const u = newUser.trim().toLowerCase();
    const p = newPass.trim();

    if(!u || !p){
      setErr('Username dan password pengguna baru wajib diisi.');
      return;
    }
    if(u.length < 3){
      setErr('Username minimal 3 karakter.');
      return;
    }
    if(p.length < 4){
      setErr('Password minimal 4 karakter.');
      return;
    }
    if(users.some(x => x.username.toLowerCase() === u)){
      setErr('Username "' + u + '" sudah digunakan.');
      return;
    }

    const updated = users.concat([{
      username: u,
      password: p,
      role: newRole
    }]);

    saveList(updated);
    setNewUser('');
    setNewPass('');
    setNewRole('staf');
    setSucc('Pengguna @' + u + ' (' + newRole + ') berhasil ditambahkan!');
    notify('Akun "@' + u + '" berhasil dibuat!');
  };

  const handleDeleteUser=(targetUsername)=>{
    setErr('');
    setSucc('');
    if(targetUsername.toLowerCase() === currentUser.username.toLowerCase()){
      setErr('Anda tidak bisa menghapus akun Anda sendiri.');
      return;
    }
    const updated = users.filter(x => x.username.toLowerCase() !== targetUsername.toLowerCase());
    saveList(updated);
    notify('Akun "@' + targetUsername + '" telah dihapus.');
  };

  const isAdmin = (currentUser.role || currentUser.username) === 'admin';

  return h('div',{className:'nb-card p-4 sm:p-5 border-2 border-black bg-white shadow-[6px_6px_0_0_#111] no-print space-y-4'},
    // Header Panel Buka-Tutup
    h('div',{className:'flex justify-between items-center pb-2.5 border-b-2 border-black'},
      h('div',{className:'flex items-center gap-2'},
        h('span',{className:'text-xl'},isAdmin ? '⚙️' : '🔒'),
        h('h3',{className:'text-base sm:text-lg font-extrabold'},'Kelola Pengguna & Akun'),
        h('span',{className:`tag ${isAdmin ? 'mint' : 'lilac'} text-[10px]`},isAdmin ? 'Admin' : 'Staf')
      ),
      h('button',{
        type:'button',
        onClick:onClose,
        className:'nb-btn canary text-xs px-2.5 py-1 font-bold',
        title:'Tutup Panel'
      },'✕ Tutup Panel')
    ),

    err ? h('div',{className:'p-2.5 rounded-lg border-2 border-black bg-coral text-white text-xs font-bold shadow-[2px_2px_0_0_#111]'},
      '⚠️ ' + err
    ) : null,

    succ ? h('div',{className:'p-2.5 rounded-lg border-2 border-black bg-mint text-black text-xs font-bold shadow-[2px_2px_0_0_#111]'},
      '✅ ' + succ
    ) : null,

    // KARTU 2 & 3: KHUSUS ADMIN (TAMBAH PENGGUNA & KELOLA DAFTAR AKUN)
    isAdmin ? h('div',{className:'space-y-4'},
      // Form Tambah Pengguna Baru
      h('form',{onSubmit:handleAddUser, className:'p-3.5 rounded-xl border-2 border-black bg-cream shadow-[2px_2px_0_0_#111] space-y-3'},
        h('div',{className:'text-xs font-extrabold uppercase tracking-wider text-slate-800'},
          '+ Tambah Pengguna Baru (Staf / Kasir)'
        ),
        h('div',{className:'grid grid-cols-1 sm:grid-cols-3 gap-2.5'},
          h('div',null,
            h('label',{className:'block text-[10px] font-bold uppercase mb-1'},'Username Baru'),
            h('input',{
              type:'text',
              value:newUser,
              onChange:e=>setNewUser(e.target.value),
              className:'nb-in text-xs py-1.5'
            })
          ),
          h('div',null,
            h('label',{className:'block text-[10px] font-bold uppercase mb-1'},'Password Awal'),
            h('input',{
              type:'password',
              value:newPass,
              onChange:e=>setNewPass(e.target.value),
              className:'nb-in text-xs py-1.5'
            })
          ),
          h('div',null,
            h('label',{className:'block text-[10px] font-bold uppercase mb-1'},'Peran (Role)'),
            h('select',{
              value:newRole,
              onChange:e=>setNewRole(e.target.value),
              className:'nb-in text-xs py-1.5 font-bold'
            },
              h('option',{value:'staf'},'Staf (Hanya Catat)'),
              h('option',{value:'admin'},'Administrator (Penuh)')
            )
          )
        ),
        h('button',{
          type:'submit',
          className:'nb-btn mint text-xs py-2 px-4 font-bold shadow-[2px_2px_0_0_#111]'
        },'Simpan Pengguna Baru')
      ),

      // Daftar Pengguna Aktif & Fitur Reset Password dari Admin
      h('div',{className:'pt-1'},
        h('div',{className:'flex items-center justify-between mb-2'},
          h('h4',{className:'text-xs font-extrabold uppercase tracking-wider text-slate-800'},'Daftar Semua Pengguna Terdaftar'),
          h('span',{className:'tag canary text-[10px]'},users.length + ' Pengguna')
        ),
        h('div',{className:'grid grid-cols-1 sm:grid-cols-2 gap-2.5'},
          users.map(u => {
            const isMe = u.username.toLowerCase() === currentUser.username.toLowerCase();
            const uIsAdmin = (u.role || (u.username==='admin'?'admin':'staf')) === 'admin';
            const isEditingThis = editingUserPass === u.username;

            return h('div',{
              key:u.username,
              className:'p-3 rounded-lg border-2 border-black bg-white shadow-[2px_2px_0_0_#111] space-y-2'
            },
              h('div',{className:'flex items-center justify-between'},
                h('div',{className:'flex items-center gap-1.5'},
                  h('span',{className:'mono font-extrabold text-xs'},'@' + u.username),
                  isMe ? h('span',{className:'tag canary text-[10px]'},'Anda') : null,
                  h('span',{className:`tag ${uIsAdmin ? 'mint' : 'lilac'} text-[10px]`},uIsAdmin ? 'Admin' : 'Staf')
                ),
                h('div',{className:'flex items-center gap-1.5'},
                  h('button',{
                    type:'button',
                    onClick:()=>{
                      if(isEditingThis){
                        setEditingUserPass(null);
                        setAdminSetPass('');
                      } else {
                        setEditingUserPass(u.username);
                        setAdminSetPass('');
                      }
                    },
                    className:'ico-btn canary text-xs w-7 h-7',
                    title:'Ganti / Reset Password Akun Ini'
                  },'🔑'),
                  !isMe ? h('button',{
                    type:'button',
                    onClick:()=>handleDeleteUser(u.username),
                    className:'ico-btn coral text-xs w-7 h-7',
                    title:'Hapus Pengguna'
                  },'🗑️') : null
                )
              ),
              // Kotak Ubah Password oleh Admin jika tombol kunci ditekan
              isEditingThis ? h('div',{className:'pt-2 border-t border-slate-200'},
                h('label',{className:'block text-[10px] font-bold text-slate-600 mb-1'},'Set Password Baru untuk @' + u.username + ':'),
                h('div',{className:'flex gap-1.5'},
                  h('input',{
                    type:'password',
                    placeholder:'Password baru...',
                    value:adminSetPass,
                    onChange:e=>setAdminSetPass(e.target.value),
                    className:'nb-in text-xs py-1'
                  }),
                  h('button',{
                    type:'button',
                    onClick:()=>handleSaveAdminSetPass(u.username),
                    className:'nb-btn mint text-[10px] px-2.5 py-1 font-bold'
                  },'Simpan'),
                  h('button',{
                    type:'button',
                    onClick:()=>setEditingUserPass(null),
                    className:'nb-btn text-[10px] px-2 py-1'
                  },'✕')
                )
              ) : null
            );
          })
        )
      )
    ) : null
  );
}

function App(){
  const [currentUser, setCurrentUser]=useState(null);
  const [authChecked, setAuthChecked]=useState(false);

  const [txs,setTxs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [f,setF]=useState(empty());
  const [editId,setEditId]=useState(null);
  const [err,setErr]=useState({});
  const [flt,setFlt]=useState({dari:'',sampai:'',q:''});
  const [modal,setModal]=useState(null);
  const [userModalOpen, setUserModalOpen]=useState(false);
  const [impTeks,setImpTeks]=useState('');
  const [impMsg,setImpMsg]=useState(null);
  const [toast,setToast]=useState(null);

  const notify=(text,type='success')=>{
    setToast({text,type});
    setTimeout(()=>setToast(null),3200);
  };

  // 1. Cek sesi login saat halaman dimuat
  useEffect(()=>{
    try{
      const sess = localStorage.getItem(SESSION_KEY);
      if(sess){
        setCurrentUser(JSON.parse(sess));
      }
    }catch(e){}
    setAuthChecked(true);
  },[]);

  const [isCloudOnline, setIsCloudOnline]=useState(false);

  // 2. Sinkronisasi Data Transaksi dengan Firebase Realtime Database
  useEffect(()=>{
    if(!currentUser) {
      setLoading(false);
      return;
    }
    const userStorageKey = KEY_PREFIX + currentUser.username;
    
    // Muat cache lokal terlebih dahulu
    try{
      const r = localStorage.getItem(userStorageKey);
      if(r) setTxs(JSON.parse(r));
      else setTxs(dummyData);
    }catch(e){
      setTxs(dummyData);
    }
    setLoading(false);

    // Hubungkan listener Firebase real-time
    if(txsRef){
      txsRef.on('value', snapshot => {
        const val = snapshot.val();
        setIsCloudOnline(true);
        if(val && Array.isArray(val)){
          setTxs(val);
          try{ localStorage.setItem(userStorageKey, JSON.stringify(val)); }catch(e){}
        } else if(!val) {
          // Jika di cloud masih kosong, inisialisasi dengan data awal
          txsRef.set([]);
        }
      }, err => {
        console.warn('Firebase sync error:', err);
        setIsCloudOnline(false);
      });
    }
  },[currentUser]);

  const save=list=>{
    setTxs(list);
    if(currentUser){
      const userStorageKey = KEY_PREFIX + currentUser.username;
      try{localStorage.setItem(userStorageKey, JSON.stringify(list));}catch(e){}
    }
    if(txsRef){
      txsRef.set(list).catch(err => console.warn('Firebase save error:', err));
    }
  };

  const handleLoginSuccess=(user)=>{
    setCurrentUser(user);
    try{ localStorage.setItem(SESSION_KEY, JSON.stringify(user)); }catch(e){}
    notify('Selamat datang kembali, ' + (user.name || user.username) + '!');
  };

  const handleLogout=()=>{
    setCurrentUser(null);
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    notify('Anda telah keluar.');
  };

  const rows=useMemo(()=>{
    const s=[...txs].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)||a.id-b.id);
    let saldo=0;
    return s.map(t=>{saldo+=t.jenis==='D'?t.jumlah:-t.jumlah;return Object.assign({},t,{saldo:saldo});});
  },[txs]);

  const shown=rows.filter(t=>
    (!flt.dari||t.tanggal>=flt.dari)&&(!flt.sampai||t.tanggal<=flt.sampai)&&
    (!flt.q||t.ket.toLowerCase().includes(flt.q.toLowerCase())));

  const totD=txs.filter(t=>t.jenis==='D').reduce((a,t)=>a+t.jumlah,0);
  const totK=txs.filter(t=>t.jenis==='K').reduce((a,t)=>a+t.jumlah,0);
  const saldo=totD-totK;

  const submit=()=>{
    const e={};
    const n=parseInt(f.jumlah||'0',10);
    if(!f.tanggal)e.tanggal='Tanggal wajib diisi';
    if(!f.ket.trim())e.ket='Keterangan tidak boleh kosong';
    if(!(n>0))e.jumlah='Jumlah harus lebih dari 0';
    setErr(e);
    if(Object.keys(e).length)return;
    const data={tanggal:f.tanggal,ket:f.ket.trim(),jenis:f.jenis,jumlah:n};
    if(editId){
      save(txs.map(t=>t.id===editId?Object.assign({id:editId},data):t));
      notify('Perubahan transaksi berhasil disimpan!');
    } else {
      save(txs.concat([Object.assign({id:Date.now()},data)]));
      notify('Transaksi baru berhasil ditambahkan!');
    }
    setF(empty());setEditId(null);
  };

  const edit=t=>{setEditId(t.id);setF({tanggal:t.tanggal,ket:t.ket,jenis:t.jenis,jumlah:String(t.jumlah)});setErr({});window.scrollTo({top:0,behavior:'smooth'});};
  const cancel=()=>{setEditId(null);setF(empty());setErr({});};

  const pilihFile=e=>{
    const fl=e.target.files&&e.target.files[0];
    if(!fl)return;
    const r=new FileReader();
    r.onload=()=>{setImpTeks(String(r.result));setImpMsg(null);};
    r.onerror=()=>setImpMsg({ok:false,text:'Gagal membaca file.'});
    r.readAsText(fl);
    e.target.value='';
  };

  const doImpor=(ganti)=>{
    const r=bacaTx(impTeks);
    if(r.error){setImpMsg({ok:false,text:r.error});return;}
    let baru=r.txs,dup=0;
    if(!ganti){
      const ada=new Set(txs.map(kunci));
      baru=baru.filter(t=>{if(ada.has(kunci(t))){dup++;return false;}return true;});
    }
    if(!baru.length){setImpMsg({ok:false,text:'Tidak ada transaksi baru yang bisa diimpor'+(dup?' ('+dup+' sudah ada)':'')+'.'});return;}
    save(ganti?baru:txs.concat(baru));
    if(ganti)cancel();
    setImpTeks('');
    setImpMsg({ok:true,text:'Berhasil mengimpor '+baru.length+' transaksi'+(r.skip?', '+r.skip+' baris dilewati':'')+(dup?', '+dup+' dilewati karena duplikat':'')+'.'});
    notify('Impor data CSV berhasil!');
  };
  const tutupImpor=()=>{setModal(null);setImpMsg(null);setImpTeks('');};

  const csv=()=>{
    const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    const lines=[['Tanggal','Keterangan','Debet','Kredit','Saldo'].join(',')];
    shown.forEach(t=>lines.push([tgl(t.tanggal),q(t.ket),t.jenis==='D'?t.jumlah:0,t.jenis==='K'?t.jumlah:0,t.saldo].join(',')));
    return lines.join('\n');
  };

  const copyCsv=()=>{
    const box=document.getElementById('csvbox');
    box.select();
    try{
      navigator.clipboard.writeText(box.value);
      notify('Teks CSV berhasil disalin!');
    }catch(e){
      try{document.execCommand('copy');notify('Teks CSV berhasil disalin!');}
      catch(e2){notify('Silakan salin teks secara manual','error');}
    }
  };

  const unduhCsv=()=>{
    const text=csv();
    const blob=new Blob([text],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='buku-debet-kredit-'+today()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
    notify('File CSV berhasil diunduh!');
  };

  const unduhPdf=()=>{
    try {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        window.print();
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.setTextColor(17, 17, 17);
      doc.text('LAPORAN BUKU KAS (DEBET KREDIT)', 14, 18);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(100, 100, 100);
      doc.text('Pemilik Akun: ' + ('@' + currentUser.username) + ' • Dicetak: ' + new Date().toLocaleString('id-ID'), 14, 24);

      doc.setDrawColor(17, 17, 17);
      doc.setLineWidth(0.5);

      doc.setFillColor(209, 250, 229);
      doc.roundedRect(14, 28, 56, 16, 2, 2, 'FD');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.setTextColor(4, 120, 87);
      doc.text('TOTAL DEBET (MASUK)', 18, 33);
      doc.setFontSize(11);
      doc.text(rp(totD), 18, 40);

      doc.setFillColor(255, 228, 230);
      doc.roundedRect(74, 28, 56, 16, 2, 2, 'FD');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.setTextColor(190, 18, 60);
      doc.text('TOTAL KREDIT (KELUAR)', 78, 33);
      doc.setFontSize(11);
      doc.text(rp(totK), 78, 40);

      doc.setFillColor(254, 240, 138);
      doc.roundedRect(134, 28, 62, 16, 2, 2, 'FD');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.setTextColor(17, 17, 17);
      doc.text('SALDO AKHIR BERJALAN', 138, 33);
      doc.setFontSize(11);
      doc.text(rp(saldo), 138, 40);

      const tableData = shown.map((t, idx) => [
        String(idx + 1),
        tgl(t.tanggal),
        t.ket,
        t.jenis === 'D' ? rp(t.jumlah) : '-',
        t.jenis === 'K' ? rp(t.jumlah) : '-',
        rp(t.saldo)
      ]);

      doc.autoTable({
        startY: 48,
        head: [['No', 'Tanggal', 'Keterangan Transaksi', 'Debet (+)', 'Kredit (-)', 'Saldo']],
        body: tableData,
        theme: 'grid',
        styles: {
          fontSize: 8.5,
          font: 'helvetica',
          textColor: [17, 17, 17],
          lineColor: [17, 17, 17],
          lineWidth: 0.2,
          cellPadding: 2.5
        },
        headStyles: {
          fillColor: [255, 210, 63],
          textColor: [17, 17, 17],
          fontStyle: 'bold',
          halign: 'center'
        },
        columnStyles: {
          0: { halign: 'center', cellWidth: 10 },
          1: { halign: 'center', cellWidth: 24 },
          2: { halign: 'left' },
          3: { halign: 'right', cellWidth: 32, textColor: [4, 120, 87] },
          4: { halign: 'right', cellWidth: 32, textColor: [190, 18, 60] },
          5: { halign: 'right', cellWidth: 34, fontStyle: 'bold' }
        },
        didDrawPage: function(data) {
          const str = 'Halaman ' + doc.internal.getNumberOfPages();
          doc.setFontSize(8);
          doc.setTextColor(120);
          doc.text(str, data.settings.margin.left, doc.internal.pageSize.height - 8);
          doc.text('Buku Debet Kredit Standar UMKM', doc.internal.pageSize.width - data.settings.margin.right - 45, doc.internal.pageSize.height - 8);
        }
      });

      doc.save('buku-debet-kredit-' + today() + '.pdf');
      notify('File PDF berhasil diunduh!');
      setModal(null);
    } catch(err) {
      console.error('Gagal cetak PDF:', err);
      window.print();
      notify('Membuka dialog cetak browser...');
    }
  };

  const field=(label,el,er)=>h('div',null,
    h('label',{className:'block text-xs font-bold uppercase mb-1'},label),el,
    er?h('p',{className:'text-xs font-bold mt-1'},h('span',{className:'tag coral'},er)):null);
  const stat=(label,val,bg)=>h('div',{className:'nb-card p-4 '+bg},
    h('p',{className:'text-xs font-bold uppercase'},label),
    h('p',{className:'mono text-xl sm:text-2xl font-bold mt-1 break-all'},val));
  const set=(k)=>(e)=>setF(Object.assign({},f,{[k]:e.target.value}));
  const setFl=(k)=>(e)=>setFlt(Object.assign({},flt,{[k]:e.target.value}));

  if(!authChecked) return h('div',{className:'p-10 text-center font-bold text-lg'},'Memeriksa akun...');

  // Jika belum login, tampilkan Halaman Login
  if(!currentUser){
    return h(LoginPage, { onLoginSuccess: handleLoginSuccess, notify: notify });
  }

  if(loading)return h('div',{className:'p-10 text-center font-bold'},'Memuat data buku kas...');

    return h('div',{className:'mx-auto max-w-5xl p-3 sm:p-6 space-y-4 sm:space-y-5'},
    toast?h('div',{className:'fixed top-4 right-4 z-50 p-3 bg-white border-2 border-black rounded-lg shadow-[4px_4px_0_0_#111] flex items-center gap-2 text-xs font-bold'},
      h('span',{className:'w-2.5 h-2.5 rounded-full '+(toast.type==='error'?'bg-coral':'bg-mint')}),
      h('span',null,toast.text),
      h('button',{type:'button',onClick:()=>setToast(null),className:'ml-2 text-slate-500 hover:text-black font-extrabold'},'✕')
    ):null,

    // Header Title, User Profile & Action Buttons
    h('header',{className:'space-y-3'},
      // Baris 1: Judul Aplikasi (Kiri) dan Profil Pengguna + Logout (Kanan)
      h('div',{className:'flex flex-wrap items-center justify-between gap-2.5'},
        h('h1',{className:'text-xl sm:text-3xl font-normal'},
          h('span',{className:'tag pink',style:{borderRadius:'8px',padding:'.25rem .75rem',boxShadow:'4px 4px 0 0 #111'}},'Buku Debet Kredit')
        ),
        h('div',{className:'flex items-center gap-2 flex-wrap'},
          // Badge Pengguna Aktif
          h('div',{className:'flex items-center gap-1.5 bg-white border-2 border-black rounded-lg px-2.5 py-1.5 shadow-[2px_2px_0_0_#111] text-xs font-bold'},
            h(IcoUser),
            h('span',null,'@' + currentUser.username),
            h('span',{className:'tag ' + ((currentUser.role||currentUser.username)==='admin'?'mint':'lilac') + ' text-[10px] ml-1'},
              (currentUser.role||currentUser.username)==='admin'?'Admin':'Staf'
            )
          ),
          h('button',{
            type:'button',
            onClick:handleLogout,
            className:'nb-btn coral text-xs px-2.5 py-1.5',
            title:'Keluar dari akun'
          }, h(IcoLogout), h('span',null,'Keluar'))
        )
      ),

      // Baris 2: Tombol Kelola Pengguna & Tombol Tindakan
      h('div',{className:'flex flex-wrap items-center gap-2 no-print'},
        ((currentUser.role || currentUser.username) === 'admin') ? h('button',{
          type:'button',
          onClick:()=>setUserModalOpen(!userModalOpen),
          className:`nb-btn text-xs px-3 py-1.5 font-bold ${userModalOpen ? 'mint' : 'canary'}`,
          title:'Buka/Tutup Kelola Akun Pengguna'
        }, h('span',null, userModalOpen ? '✕ Tutup Pengguna' : '👥 Kelola Pengguna')) : null,
        h('button',{type:'button',onClick:()=>{setImpMsg(null);setImpTeks('');setModal({t:'impor'});},className:'nb-btn canary text-xs px-3 py-1.5'},'Impor CSV'),
        h('button',{type:'button',onClick:()=>setModal({t:'csv'}),className:'nb-btn lilac text-xs px-3 py-1.5'},'Ekspor CSV'),
        h('button',{type:'button',onClick:()=>setModal({t:'pdf'}),className:'nb-btn mint text-xs px-3 py-1.5 font-bold'},'📄 Cetak PDF'),
        h('button',{type:'button',onClick:()=>setModal({t:'reset'}),className:'nb-btn coral text-xs px-3 py-1.5'},'Reset Data')
      )
    ),

    // Panel Kelola Pengguna & Ganti Password
    userModalOpen ? h(UserManagementPanel, {
      currentUser: currentUser,
      onClose: () => setUserModalOpen(false),
      notify: notify,
      onUpdateCurrentUser: (updatedUser) => {
        setCurrentUser(updatedUser);
        try{ localStorage.setItem(SESSION_KEY, JSON.stringify(updatedUser)); }catch(e){}
      }
    }) : null,

    // Status Badges
    h('div',{className:'flex flex-wrap items-center gap-2'},
      h('span',{className:'tag mint text-xs'},'Akun: ' + ('@' + currentUser.username)),
      h('span',{className:'tag canary text-xs'},'Data Pribadi Tersimpan Mandiri'),
      h('span',{className:'text-xs font-bold mono text-slate-600'},'• '+txs.length+' transaksi tersimpan')
    ),

    // 3 Stat Cards
    h('div',{className:'grid grid-cols-1 sm:grid-cols-3 gap-4'},
      stat('Total Debet',rp(totD),'mint'),
      stat('Total Kredit',rp(totK),'coral'),
      stat('Saldo (Debet - Kredit)',rp(saldo),saldo<0?'pink':'canary')),

    // Form Tambah/Edit Transaksi
    h('div',{className:'nb-card p-4 sm:p-5 no-print'},
      h('h2',{className:'text-lg mb-3'},editId?'Edit Transaksi':'Tambah Transaksi'),
      h('div',{className:'grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4'},
        field('Tanggal',h('input',{type:'date',className:'nb-in',value:f.tanggal,onChange:set('tanggal')}),err.tanggal),
        field('Jenis',h(Pilih,{value:f.jenis,onChange:v=>setF(Object.assign({},f,{jenis:v})),opsi:[{v:'D',l:'Debet (Pemasukan)',c:'mint'},{v:'K',l:'Kredit (Pengeluaran)',c:'coral'}]})),
        field('Keterangan',h('input',{type:'text',className:'nb-in',placeholder:'Contoh: Penjualan harian, Beli stok',value:f.ket,onChange:set('ket')}),err.ket),
        field('Jumlah (Rp)',h('input',{type:'text',inputMode:'numeric',className:'nb-in mono',placeholder:'0',
          value:f.jumlah?Number(f.jumlah).toLocaleString('id-ID'):'',
          onChange:e=>setF(Object.assign({},f,{jumlah:e.target.value.replace(/\D/g,'').slice(0,13)}))}),err.jumlah)),
      h('div',{className:'mt-4 flex gap-3'},
        h('button',{type:'button',onClick:submit,className:'nb-btn mint font-bold'},editId?'Simpan Perubahan':'+ Tambah Transaksi'),
        editId?h('button',{type:'button',onClick:cancel,className:'nb-btn'},'Batal'):null)),

    // Filter & Table
    h('div',{className:'nb-card p-4 sm:p-5'},
      h('div',{className:'grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4 no-print'},
        field('Dari tanggal',h('input',{type:'date',className:'nb-in',value:flt.dari,onChange:setFl('dari')})),
        field('Sampai tanggal',h('input',{type:'date',className:'nb-in',value:flt.sampai,onChange:setFl('sampai')})),
        field('Cari keterangan',h('input',{type:'text',className:'nb-in',placeholder:'Cari...',value:flt.q,onChange:setFl('q')}))),
      h('div',{className:'overflow-x-auto tbl-wrap',style:{border:'2px solid #111',borderRadius:'10px'}},
        h('table',{className:'nb-table w-full text-sm'},
          h('thead',null,h('tr',{className:'text-left'},
            ['Tanggal','Keterangan','Debet','Kredit','Saldo','Aksi'].map((c,i)=>h('th',{key:c,className:'px-3 py-2.5 '+(i>=2&&i<5?'text-right':'')},c)))),
          h('tbody',null,
            shown.length===0?h('tr',null,h('td',{colSpan:6,className:'px-3 py-8 text-center font-bold text-slate-500',style:{borderBottom:0}},'Belum ada transaksi.')):
            shown.map(t=>h('tr',{key:t.id},
              h('td',{'data-label':'Tanggal',className:'mono px-3 py-2.5 whitespace-nowrap'},tgl(t.tanggal)),
              h('td',{'data-label':'Keterangan',className:'px-3 py-2.5 font-semibold'},t.ket),
              h('td',{'data-label':'Debet',className:'mono px-3 py-2.5 text-right whitespace-nowrap font-bold'},t.jenis==='D'?h('span',{className:'tag mint'},rp(t.jumlah)):''),
              h('td',{'data-label':'Kredit',className:'mono px-3 py-2.5 text-right whitespace-nowrap font-bold'},t.jenis==='K'?h('span',{className:'tag coral'},rp(t.jumlah)):''),
              h('td',{'data-label':'Saldo',className:'mono px-3 py-2.5 text-right whitespace-nowrap font-bold'},h('span',{className:t.saldo<0?'tag pink':''},rp(t.saldo))),
              h('td',{'data-label':'Aksi',className:'px-3 py-2.5 whitespace-nowrap no-print'},
                h('div',{className:'flex gap-2 justify-end sm:justify-start'},
                h('button',{type:'button',onClick:()=>edit(t),className:'ico-btn canary',title:'Edit','aria-label':'Edit'},h(IcoEdit)),
                h('button',{type:'button',onClick:()=>setModal({t:'del',id:t.id}),className:'ico-btn coral',title:'Hapus','aria-label':'Hapus'},h(IcoTrash)))))))))),

    // Modal Pilihan Cetak PDF
    modal&&modal.t==='pdf'?h(Modal,{title:'Cetak Laporan / PDF',
      actions:[
        h('button',{key:'c',type:'button',onClick:()=>setModal(null),className:'nb-btn'},'Batal')
      ]},
      h('p',{className:'text-xs font-semibold text-slate-600 mb-4'},
        'Laporan dicetak rapi pada format kertas A4 standar akuntansi UMKM, lengkap dengan ringkasan total debet, kredit, dan saldo berjalan.'
      ),
      h('div',{className:'space-y-3'},
        h('button',{
          type:'button',
          onClick:unduhPdf,
          className:'nb-btn mint w-full text-left p-3.5 flex items-center justify-between text-xs sm:text-sm font-bold shadow-[4px_4px_0_0_#111]'
        },
          h('div',{className:'flex items-center gap-2.5'},
            h('span',{className:'text-xl'},'📥'),
            h('div',null,
              h('div',{className:'font-bold text-slate-900'},'Unduh Dokumen PDF (.pdf)'),
              h('div',{className:'text-[11px] font-normal text-slate-700'},'Langsung simpan file dokumen PDF ke HP / Komputer')
            )
          ),
          h('span',{className:'text-xs'},'➔')
        ),
        h('button',{
          type:'button',
          onClick:()=>{ setModal(null); setTimeout(()=>window.print(), 200); },
          className:'nb-btn canary w-full text-left p-3.5 flex items-center justify-between text-xs sm:text-sm font-bold shadow-[4px_4px_0_0_#111]'
        },
          h('div',{className:'flex items-center gap-2.5'},
            h('span',{className:'text-xl'},'🖨️'),
            h('div',null,
              h('div',{className:'font-bold text-slate-900'},'Buka Dialog Cetak Browser'),
              h('div',{className:'text-[11px] font-normal text-slate-700'},'Kirim ke printer fisik atau gunakan fitur cetak bawaan')
            )
          ),
          h('span',{className:'text-xs'},'➔')
        )
      )
    ):null,

    modal&&modal.t==='del'?h(Modal,{title:'Hapus transaksi?',
      actions:[h('button',{key:'b',type:'button',onClick:()=>setModal(null),className:'nb-btn'},'Batal'),
        h('button',{key:'h',type:'button',onClick:()=>{save(txs.filter(t=>t.id!==modal.id));if(editId===modal.id)cancel();setModal(null);notify('Transaksi dihapus.');},className:'nb-btn coral'},'Hapus')]},
      h('p',{className:'text-sm font-semibold'},'Transaksi ini akan dihapus permanen dari buku kas lokal Anda.')):null,

    modal&&modal.t==='reset'?h(Modal,{title:'Reset semua data?',
      actions:[h('button',{key:'b',type:'button',onClick:()=>setModal(null),className:'nb-btn'},'Batal'),
        h('button',{key:'r',type:'button',onClick:()=>{save([]);cancel();setModal(null);notify('Data berhasil di-reset.');},className:'nb-btn coral'},'Ya, Reset')]},
      h('p',{className:'text-sm font-semibold'},'Seluruh transaksi akan dihapus dan saldo kembali ke Rp 0.')):null,

    modal&&modal.t==='impor'?h(Modal,{title:'Impor CSV',
      actions:[
        h('button',{key:'a',type:'button',disabled:!impTeks.trim(),onClick:()=>doImpor(false),className:'nb-btn mint'},'Tambahkan ke Data'),
        h('button',{key:'g',type:'button',disabled:!impTeks.trim(),onClick:()=>doImpor(true),className:'nb-btn coral'},'Ganti Semua Data'),
        h('button',{key:'t',type:'button',onClick:tutupImpor,className:'nb-btn'},'Tutup')]},
      h('p',{className:'text-xs font-semibold mb-3'},'Pakai file hasil Ekspor CSV, atau CSV buatan sendiri dengan header: Tanggal, Keterangan, Debet, Kredit (kolom Saldo diabaikan). Tanggal boleh dd/mm/yyyy atau yyyy-mm-dd. Pemisah koma atau titik koma.'),
      h('label',{className:'nb-btn lilac inline-block mb-3',style:{cursor:'pointer'}},'Pilih File CSV',
        h('input',{type:'file',accept:'.csv,text/csv,text/plain',onChange:pilihFile,className:'hidden'})),
      h('textarea',{rows:6,className:'nb-in mono text-xs',placeholder:'...atau tempel isi CSV di sini',value:impTeks,onChange:e=>{setImpTeks(e.target.value);setImpMsg(null);}}),
      h('p',{className:'text-xs font-semibold mt-3'},'Tambahkan: baris yang sama persis dilewati. Ganti Semua: data lama ditimpa seluruhnya.'),
      impMsg?h('p',{className:'mt-3 text-sm font-bold'},h('span',{className:'tag '+(impMsg.ok?'mint':'coral')},impMsg.text)):null):null,

    modal&&modal.t==='csv'?h(Modal,{title:'Ekspor CSV',
      actions:[
        h('button',{key:'d',type:'button',onClick:unduhCsv,className:'nb-btn canary'},'Unduh File .CSV'),
        h('button',{key:'s',type:'button',onClick:copyCsv,className:'nb-btn mint'},'Salin Teks'),
        h('button',{key:'t',type:'button',onClick:()=>setModal(null),className:'nb-btn'},'Tutup')]},
      h('p',{className:'text-xs font-semibold mb-2'},'Salin teks berikut atau unduh langsung sebagai file .csv. Isi mengikuti filter yang aktif.'),
      h('textarea',{id:'csvbox',readOnly:true,rows:8,className:'nb-in mono text-xs select-all',value:csv()})):null
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
