            type: 'button',
            onClick: () => handleSetViewMode('table'),
            className: `px-2.5 py-1 rounded-lg text-xs font-black flex items-center gap-1.5 cursor-pointer border-2 transition-all ${viewMode === 'table' ? 'bg-canary border-black shadow-[2px_2px_0_0_#111]' : 'bg-transparent border-transparent text-slate-600 hover:text-black'}`,
            title: 'Tampilkan format Tabel (bisa digeser ke samping di HP)'
          },
            h('span', null, '📋'),
            h('span', null, 'Tabel')
          ),
          h('button', {
            type: 'button',
            onClick: () => handleSetViewMode('card'),
            className: `px-2.5 py-1 rounded-lg text-xs font-black flex items-center gap-1.5 cursor-pointer border-2 transition-all ${viewMode === 'card' ? 'bg-canary border-black shadow-[2px_2px_0_0_#111]' : 'bg-transparent border-transparent text-slate-600 hover:text-black'}`,
            title: 'Tampilkan format Kartu per transaksi'
          },
            h('span', null, '🗂️'),
            h('span', null, 'Kartu')
          )
        )
      ),

      // Filter Rapi Simetris 3 Kolom (Combobox Jenis, Rentang Tanggal & Pencarian)
      h('div',{className:'grid grid-cols-1 sm:grid-cols-3 gap-2.5 mb-4 no-print'},
        // 1. Combobox Filter Jenis Transaksi (Mengikuti Tema Khas Neobrutalism)
        h('div',null,
          h('label',{className:'block text-[10px] font-black uppercase mb-1 text-slate-700'},'Jenis Transaksi'),
          h(Pilih,{
            value: flt.jenis || 'ALL',
            onChange: v => setFlt(Object.assign({}, flt, { jenis: v })),
            opsi: [
              { v: 'ALL', l: 'Semua Transaksi (' + txs.length + ')', c: 'bg-white' },
              { v: 'D', l: '🟢 Pemasukan (' + txs.filter(t=>t.jenis==='D').length + ')', c: 'mint' },
              { v: 'K', l: '🔴 Pengeluaran (' + txs.filter(t=>t.jenis==='K').length + ')', c: 'coral' }
            ]
          })
        ),

        // 2. Satu Inputan Rentang Tanggal (Drag / Klik)
        h('div',null,
          h('label',{className:'block text-[10px] font-black uppercase mb-1 text-slate-700'},'Rentang Tanggal (Drag / Pilih)'),
          h(DateRangePicker,{
            dari: flt.dari,
            sampai: flt.sampai,
            onChange: (range) => setFlt(Object.assign({}, flt, range))
          })
        ),

        // 3. Kotak Cari Keterangan
        h('div',null,
          h('label',{className:'block text-[10px] font-black uppercase mb-1 text-slate-700'},'Cari Keterangan'),
          h('div',{className:'relative flex items-center'},
            h('input',{
              type:'text',
              className:'nb-in text-xs',
              style:{paddingLeft:'2.25rem'},
              placeholder:'Ketik kata kunci...',
              value:flt.q,
              onChange:setFl('q')
            }),
            h('span',{className:'absolute left-2.5 text-xs text-slate-400 select-none'},'🔍')
          )
        )
      ),
      h('div',{
        className:`overflow-x-auto tbl-wrap ${viewMode === 'card' ? 'mode-card' : 'mode-table'}`,
        style: viewMode === 'card' ? {} : { border:'2px solid #111', borderRadius:'12px', boxShadow:'4px 4px 0 0 #111' }
      },
        // Petunjuk geser ke samping khusus mode tabel di ponsel
        viewMode === 'table' ? h('div', {
          className: 'px-3 py-1.5 bg-cream border-b-2 border-black flex items-center justify-between text-[10px] font-bold text-slate-600 sm:hidden'
        },
          h('span', null, '👉 Geser tabel ke samping untuk melihat Debet, Kredit, Saldo & Aksi'),
          h('span', null, '➔')
        ) : null,
        h('table',{
          className:'nb-table w-full text-sm',
          style: viewMode === 'table' ? { minWidth: '620px' } : {}
        },
          h('thead',null,h('tr',{className:'text-left'},
            ['Tanggal','Keterangan','Debet','Kredit','Saldo','Aksi'].map((c,i)=>h('th',{key:c,className:'px-3 py-2.5 '+(i>=2&&i<5?'text-right':'')},c)))),
          h('tbody',null,
            shown.length===0?h('tr',null,h('td',{colSpan:6,className:'px-3 py-8 text-center font-bold text-slate-500',style:{borderBottom:0}},'Belum ada transaksi.')):
            shown.map(t=>h('tr',{key:t.id},
              h('td',{'data-label':'Tanggal',className:'mono px-3 py-2.5 whitespace-nowrap'},tgl(t.tanggal)),
              h('td',{'data-label':'Keterangan',className:'px-3 py-2.5 font-semibold'},t.ket),
              h('td',{'data-label':'Debet',className:'mono px-3 py-2.5 text-right whitespace-nowrap font-bold'},t.jenis==='D'?h('span',{className:'tag mint'},rp(t.jumlah)):''),
              h('td',{'data-label':'Kredit',className:'mono px-3 py-2.5 text-right whitespace-nowrap font-bold'},t.jenis==='K'?h('span',{className:'tag coral'},rp(t.jumlah)):''),
              h('td',{'data-label':'Saldo',className:'mono px-3 py-2.5 text-right whitespace-nowrap font-bold'},h('span',{className:t.saldo<0?'tag pink':''},rp(t.saldo))),
              h('td',{'data-label':'Aksi',className:'px-3 py-2.5 whitespace-nowrap no-print'},
                h('div',{className:'flex gap-2 justify-end sm:justify-start'},
                h('button',{type:'button',onClick:()=>edit(t),className:'ico-btn canary',title:'Edit','aria-label':'Edit'},h(IcoEdit)),
                h('button',{type:'button',onClick:()=>openFeature('del',{id:t.id}),className:'ico-btn coral',title:'Hapus','aria-label':'Hapus'},h(IcoTrash)))))))))),

    // Tombol + Melayang di Pojok Kanan Bawah (Floating Action Button)
    h('button',{
      type:'button',
      onClick:scrollToForm,
      className:'fixed z-40 flex items-center justify-center font-black cursor-pointer shadow-[4px_4px_0_0_#111] hover:scale-105 active:scale-95 transition-transform no-print',
      style:{
        right:'16px',
        bottom:'calc(16px + env(safe-area-inset-bottom, 0px))',
        width:'54px',
        height:'54px',
        borderRadius:'16px',
        border:'2.5px solid #111',
        backgroundColor:'var(--mint)',
        color:'#111'
      },
      title:'Tambah Transaksi Baru (+)',
      'aria-label':'Tambah Transaksi Baru'
    },
      h('svg',{width:26,height:26,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:3.2,strokeLinecap:'round',strokeLinejoin:'round','aria-hidden':'true'},
        h('line',{x1:12,y1:5,x2:12,y2:19}),
        h('line',{x1:5,y1:12,x2:19,y2:12})
      )
    )
  );
}
    try {
      var rootEl = document.getElementById('root');
      if (rootEl) {
        ReactDOM.createRoot(rootEl).render(h(ErrorBoundary, null, h(App)));
      }
    } catch(err) {
      console.error('Mount error:', err);
      showCdnError(err.message);
    }
  }

  // Jalankan startApp saat siap
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startApp);
  } else {
    startApp();
  }
})();
</script>
</body>
</html>
